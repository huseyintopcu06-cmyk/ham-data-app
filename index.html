<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#16202e;--mut:#667085;--line:#e3e8ef;--navy:#1F3864;--ga:#e3f0fb;--ga-line:#2E75B6;--ok:#117a3d;--bad:#c0392b;--org:#c65911;--chip:#e9eef6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131b;--card:#171e29;--ink:#e8edf5;--mut:#93a0b4;--line:#263041;--navy:#2c4a82;--ga:#16314a;--ga-line:#4f9bdc;--ok:#4cc27f;--bad:#ff7b6b;--org:#ffa45c;--chip:#222c3c}}
:root[data-theme=dark]{--bg:#0e131b;--card:#171e29;--ink:#e8edf5;--mut:#93a0b4;--line:#263041;--navy:#2c4a82;--ga:#16314a;--ga-line:#4f9bdc;--ok:#4cc27f;--bad:#ff7b6b;--org:#ffa45c;--chip:#222c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
header h1{margin:0;font-size:16px;font-weight:700}
header small{opacity:.8;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.2}
#st{font-size:11px;padding:5px 7px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16202e;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:.95}
header .row>div:first-child{min-width:0;flex:1}
header .row>div:last-child{flex:none;display:flex;gap:4px}
header h1,header small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#upd{position:sticky;top:58px;z-index:4;background:#FFC000;color:#1a1a1a;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
#upd[hidden]{display:none}
#upd button{background:#1F3864;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:700}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 1px 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}
nav button.on{color:var(--navy);font-weight:700}
@media(prefers-color-scheme:dark){nav button.on{color:#8db6ff}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff}
h2{font-size:14px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;overflow:hidden}
.card.ga{background:var(--ga);border-color:var(--ga-line)}
.card summary{list-style:none;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.rk{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:13px}
.nm{flex:1;min-width:0}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:12px;color:var(--mut)}
.kv{flex:none;text-align:right}
.kv b{font-size:18px;display:block}
.kv span{display:block;font-size:12px;color:var(--org);font-weight:600}
.kv small{display:block;font-size:10px;line-height:1;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.kv .stk{color:var(--mut);font-weight:500;margin-top:1px}
.det{border-top:1px solid var(--line);padding:6px 12px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.det h4{grid-column:1/-1;margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--org)}
.det i{font-style:normal;color:var(--mut)}
.det b{text-align:right}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;font-weight:600;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--navy)}
tr.ga td{background:var(--ga)}
tr.tot td{font-weight:700;background:var(--chip)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-right:6px}
.t-red{background:#f8cbad;color:#a4261c}.t-org{background:#fce4d6;color:#a4501a}.t-yel{background:#fff2cc;color:#7a5b00}
.imgs img{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;background:#fff}
.msg{text-align:center;color:var(--mut);padding:36px 12px}
.setup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.setup input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0 10px}
.setup .go{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.card .sm{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.chev{color:var(--mut);font-size:20px;padding-left:4px}
.dep{padding:10px 12px}
.dh2{display:flex;align-items:center;gap:8px;margin-bottom:8px}.dh2 span{font-size:12px;color:var(--mut)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.g4 small{display:flex;align-items:flex-end;justify-content:center;min-height:24px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;line-height:1.15;margin-bottom:2px}
.g4 b{font-size:17px}.g4 b.or{color:var(--org)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.dik{padding:4px 12px 6px;border-color:var(--org)}
.dik .dhd{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--org);padding:8px 0 2px}
.dik summary,.dsat{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.dik summary::-webkit-details-marker{display:none}
.dsat[data-go]{cursor:pointer}
.dot{flex:none;width:10px;height:10px;border-radius:50%}.dot.red{background:#d9453d}.dot.org{background:#e8873a}.dot.yel{background:#e6b422}
.dt{flex:1;font-weight:600;font-size:14px}.dt small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.dl{padding:0 0 8px 20px;font-size:13px}.dk{padding:3px 0}.dk small{color:var(--mut)}
.lnk{color:#2E75B6;text-decoration:underline;cursor:pointer}
.urow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.urow:first-child{border-top:0}
details .urow{grid-template-columns:1fr 54px 64px 54px}
details .urow span+span{text-align:right}
.urow.h{font-size:11px;color:var(--mut);text-transform:uppercase}
.urow[data-mk]{cursor:pointer}.urow.gar{background:var(--ga)}
.pbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pbs small{display:block;font-size:10px;color:var(--mut);margin-bottom:3px}
.pb{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pb.var{background:#d4efdc;color:#146c37}.pb.dol{background:#e6f4ea;color:#2b7a45}.pb.yok{background:#fbd5d0;color:#a4261c}.pb.acik{background:#ffe9b8;color:#7a5200}.pb.bos{background:var(--chip);color:var(--mut)}
tbody tr[data-mk]{cursor:pointer}

#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#zoom img{width:240%;max-width:none;display:block}
#zoom button{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:21;background:#fff;color:#000;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
</style>

<body>
<header><div class="row"><div><h1 id="ttl">Ham Data</h1><small id="sub">yükleniyor…</small></div><div><button class="ib" id="rf" title="Veriyi yenile">↻</button> <button class="ib" id="th" title="Tema">◐</button> <button class="ib" id="gn" title="Uygulamayı güncelle (yeni sürümü al)">⬆</button> <button class="ib" id="st" title="Çıkış yap (şifreyi bu cihazdan sil)">Çıkış</button></div></div></header>
<div id="upd" hidden><span>Yeni sürüm var</span><button id="updgo">Yenile</button></div>
<main id="m"></main>
<nav id="nv">
<button data-t="ozet" class="on"><b>▦</b>Özet</button>
<button data-t="kat"><b>☰</b>Kategori</button>
<button data-t="mag"><b>⌂</b>Mağaza</button>
<button data-t="urun"><b>⌕</b>Ürün</button>
<button data-t="trf"><b>⇄</b>Transfer</button>
<button data-t="daha"><b>⋯</b>Daha</button>
</nav>
<div id="toast"></div>
<div id="zoom"><button>Kapat ✕</button><img alt=""></div>
<script>
'use strict';
const $=s=>document.querySelector(s), M=$('#m');
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let D=null, P=null, sel={}, mode='', SALTB='';
let tab=LS.get('tab'); if(!['ozet','kat','mag','urun','trf','daha'].includes(tab))tab='ozet';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isGA=r=>r.some(c=>typeof c==='string'&&/G[ÜU]NEY ANADOLU/i.test(c));
const isTot=r=>r.some(c=>typeof c==='string'&&/TOPLAM/.test(c));

/* ---------- sayı biçimi ---------- */
function fmt(v,h){
  if(v==null||v==='')return '–';
  if(typeof v==='string')return esc(v);
  h=h||'';
  if(/Payı|İHS/.test(h)&&Math.abs(v)<=1.5)return (v*100).toFixed(1).replace('.',',')+'%';
  if(/Tempo|vs |Tahmin vs/.test(h)&&Math.abs(v)<20){const p=Math.round(v*100);return (p>0?'+':'')+p+'%'}
  if(/Devir/.test(h))return v.toFixed(2).replace('.',',');
  if(Number.isInteger(v))return v.toLocaleString('tr-TR');
  return Math.abs(v)<100?v.toFixed(1).replace('.',','):Math.round(v).toLocaleString('tr-TR');
}
const sgn=(v,h)=>/Tempo|vs /.test(h||'')&&typeof v==='number'?(v>0?'pos':v<0?'neg':''):(typeof v==='number'&&v<0?'neg':'');

/* ---------- veri yükleme (şifreli) ---------- */
let KEY=null, SALT=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function gunzip(buf){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
async function openPack(text,pw,reuse){
  const p=JSON.parse(text);
  const key=(reuse&&KEY&&SALTB===p.salt)?KEY:await deriveKey(pw,b64(p.salt),p.iter);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));   // yanlış şifrede hata verir
  if(!reuse){KEY=key;SALTB=p.salt}
  return JSON.parse(new TextDecoder().decode(await gunzip(plain)));
}
async function load(force){
  M.innerHTML='<div class="msg">Yükleniyor…</div>';
  const pw=LS.get('pw');
  if(!pw)return gate();
  let text=null, offline=false;
  try{
    const r=await fetch('veri.enc?'+(force?Date.now():''),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    text=await r.text(); LS.set('cache_enc',text);
  }catch(e){text=LS.get('cache_enc');offline=true}
  if(!text){M.innerHTML='<div class="msg">Veri alınamadı. İnterneti kontrol edip ↻ ye bas.</div>';return}
  try{
    D=await openPack(text,pw);
    P=null;
    try{const r2=await fetch('onceki.enc?'+Date.now(),{cache:'no-store'});if(r2.ok)P=await openPack(await r2.text(),pw,true)}catch(e){}
    done(offline?'Çevrimdışı: son kaydedilen veri gösteriliyor.':'');
  }catch(e){LS.del('pw');gate('Şifre yanlış ya da değişmiş. Yeniden gir.')}
}
function gate(err){
  $('#sub').textContent='şifre gerekli';
  M.innerHTML=`<div class="setup"><b>Şifre</b>
  <p class="note" style="margin-top:6px">Raporu görmek için sana verilen şifreyi gir. Bu cihazda hatırlanır.</p>
  ${err?`<p class="neg">${esc(err)}</p>`:''}
  <input id="pw" type="password" placeholder="Şifre" autocomplete="current-password">
  <button class="go" id="pwgo">Aç</button></div>`;
  const go=()=>{const v=$('#pw').value;if(v){LS.set('pw',v);load(true)}};
  $('#pwgo').onclick=go; $('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
const AYNO={ocak:1,'şubat':2,mart:3,nisan:4,'mayıs':5,haziran:6,temmuz:7,'ağustos':8,'eylül':9,ekim:10,'kasım':11,'aralık':12};
function veriTarihi(d){  // "1-11 Kasım 2026" -> "11.11.2026" (verinin son günü)
  const m=String(d||'').match(/(\d+)(?:\s*-\s*(\d+))?\s+(\S+)\s+(\d{4})/); if(!m)return '';
  const ay=AYNO[m[3].toLocaleLowerCase('tr')]; if(!ay)return '';
  return String(m[2]||m[1]).padStart(2,'0')+'.'+String(ay).padStart(2,'0')+'.'+m[4];
}
function done(note){
  const vt=veriTarihi(D.donem); $('#ttl').textContent='Ham Data'+(vt?' · '+vt:'');
  $('#sub').textContent=(D.donem||'')+' · güncelleme '+(D.olusturma||'');
  render();
  if(note)M.insertAdjacentHTML('afterbegin',`<div class="note">${esc(note)}</div>`);
}

/* ---------- ortak bileşenler ---------- */
function table(t,opts){
  opts=opts||{};
  const h=t.kolonlar;
  let s='<div class="tw"><table><thead><tr>'+h.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';
  for(const r of t.satirlar){
    s+=`<tr class="${isGA(r)?'ga':''} ${isTot(r)?'tot':''}">`+h.map((x,i)=>{const hh=i>1?x+' '+(r[0]||''):x;return `<td class="${sgn(r[i],hh)}">${fmt(r[i],hh)}</td>`}).join('')+'</tr>';
  }
  return s+'</tbody></table></div>';
}
function chips(items,cur,key){
  return '<div class="chips">'+items.map(([id,label])=>`<button class="chip ${id===cur?'on':''}" data-k="${key}" data-v="${esc(id)}">${esc(label)}</button>`).join('')+'</div>';
}
function bindChips(){
  M.querySelectorAll('.chip[data-k]').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=b.dataset.v;render()});
}
/* kart içi kolonları başlıklı gruplara ayır: mağaza bilgisi · Sell-out · Satılabilir stok · Açık sipariş · Ay başı */
const GRUP=[['Sell-out'],['Satılabilir stok'],['Açık sipariş'],['Ay başı stok']];
function grpAd(x){
  if(/Gelen|Açık Sipariş/i.test(x))return 3;
  if(/Başlangıç/i.test(x))return 4;
  if(/Satılabilir|Stok|Set (Siyah|Beyaz|Gri|Inox)|Devir/i.test(x))return 2;
  if(/^(Sıra|Kod|Personel|SPV|Bölge|Mağaza)$/i.test(x))return 0;
  return 1;
}
function grupla(h,r,nameIdx){
  const g={0:[],1:[],2:[],3:[],4:[]};
  h.forEach((x,i)=>{
    if(r[i]==null||r[i]===''||i===nameIdx)return;
    g[grpAd(x)].push({x,i,sat:/Satılabilir/i.test(x)?0:1});
  });
  g[2].sort((a,b)=>a.sat-b.sat||a.i-b.i);          // satılabilir stok önce
  const row=e=>`<i>${esc(e.x)}</i><b class="${sgn(r[e.i],e.x)}">${fmt(r[e.i],e.x)}</b>`;
  let s=g[0].map(row).join('');
  [[1,'Sell-out'],[2,'Satılabilir stok'],[3,'Açık sipariş'],[4,'Ay başı stok']].forEach(([k,t])=>{ if(g[k].length)s+=`<h4>${t}</h4>`+g[k].map(row).join('') });
  return s;
}
function cardList(t,o){
  // o: {rank,name,sub,main,fc}
  const h=t.kolonlar;
  return t.satirlar.map(r=>{
    const det=grupla(h,r,o.name);
    const fv=(o.fcs&&o.fcs.length)?o.fcs.reduce((a,i)=>a+N(r[i]),0):null;
    const fc=fv!=null?`<span>Tahmin ${nf(fv)}</span>`:'';
    const lk=(o.kod>=0&&r[o.kod])?`<a class="lnk" data-mk="${esc(r[o.kod])}" style="grid-column:1/-1;padding:4px 0">Mağaza sayfasına git ›</a>`:'';
    const sk=o.sat>=0&&r[o.sat]!=null?`<span class="stk">Satılabilir stok ${fmt(r[o.sat],h[o.sat])}</span>`:'';
    const gl=(o.gel&&o.gel.length)?o.gel.reduce((a,i)=>a+(+r[i]||0),0):null;
    const gs=gl!=null?`<span class="stk">Açık sipariş ${fmt(gl,'')}</span>`:'';
    return `<details class="card ${isGA(r)?'ga':''}"><summary>
      <div class="rk">${o.rank>=0?fmt(r[o.rank],''):''}</div>
      <div class="nm"><b>${esc(String(r[o.name]||'').replace(/^MEDIAMARKT\s*/,''))}</b><span>${o.sub>=0?esc(r[o.sub]):''}</span></div>
      <div class="kv"><small>Sell-out</small><b>${o.main>=0?fmt(r[o.main],h[o.main]):''}</b>${fc}${sk}${gs}</div></summary><div class="det">${lk}${det}</div></details>`;
  }).join('');
}

/* ---------- sekmeler ---------- */
function vOzet(){
  const T=D.ozet.filter(t=>t.satirlar.length);
  const cur=sel.oz!=null?sel.oz:'0';
  const short=T.map((t,i)=>[String(i),t.baslik.replace(/·.*$/,'').replace(/ORTALAMASI.*/,'ORTALAMA').trim()]);
  // Güney Anadolu özet kartı
  const g=T[0]&&T[0].satirlar.find(isGA), th=T[0]&&T[0].kolonlar;
  let hero='';
  const ft=T.find(t=>/TAHM/i.test(t.baslik)&&!/VC/.test(t.baslik));
  if(g){
    const gi=ft&&ft.satirlar.find(isGA), ti=th.findIndex(x=>/^Toplam/.test(x)), fi=ft?ft.kolonlar.findIndex(x=>/^Toplam/.test(x)):-1;
    hero=`<div class="card ga" style="padding:12px 14px"><div class="row"><div><span style="font-size:12px;color:var(--mut)">GÜNEY ANADOLU · gerçekleşen</span><br><b style="font-size:26px">${ti>=0?fmt(g[ti],''):''}</b></div>

/* FOOD Diğer: FOOD sayfasından türetilen ayrı kategori (sıralama FOOD Diğer satışına göre) */
const _fdc=new WeakMap();
function fdKategori(DD){
  DD=DD||D; if(_fdc.has(DD))return _fdc.get(DD);
  const src=DD.kategoriler['FOOD']; if(!src)return null;
  const m=String(DD.donem||'').match(/(\d+)(?:\s*-\s*(\d+))?\s+(\S+)\s+(\d{4})/);
  const pd=m?+(m[2]||m[1]):1, ay=m?AYNO[m[3].toLocaleLowerCase('tr')]:0, lmd=ay?new Date(+m[4],ay-1,0).getDate():30;
  const isT=r=>r.some(c=>typeof c==='string'&&/TOPLAM/.test(c));
  const mk=t=>{
    const h=t.kolonlar, f=re=>h.findIndex(x=>re.test(x));
    const iR=f(/^Sıra$/), iM=f(/^FOOD Diğer Toplam/), iF=f(/^Ay Sonu Tahmini FOOD Diğer/), iG=f(/Gelen.*FOOD Diğer/), iB=f(/Başlangıç FOOD Diğer/), iP=f(/^TR Payı/), iT=f(/Tempo vs/), iE=f(/^[^ ]+ FOOD Diğer Satış Adeti$/);
    const rows=t.satirlar.map(r=>r.slice()), tot=rows.filter(isT), body=rows.filter(r=>!isT(r));
    body.sort((a,b)=>(b[iM]||0)-(a[iM]||0));
    let prev=null,rk=0; body.forEach((r,i)=>{if(r[iM]!==prev){rk=i+1;prev=r[iM]} if(iR>=0)r[iR]=rk});
    const tm=tot.length?tot[0][iM]:0, keep=h.map((x,i)=>i).filter(i=>!h[i].includes('MUM'));
    const all=body.concat(tot).map(r=>{
      const v=r[iM]||0, fc=r[iF]||0;
      if(iP>=0)r[iP]=tm?v/tm:null;
      if(iT>=0)r[iT]=r[iE]>0?(v/pd)/(r[iE]/lmd)-1:null;
      const sat=(r[iB]!=null&&r[iG]!=null)?r[iB]-r[iG]+Math.max(0,fc-v):null;
      return keep.map(i=>r[i]).concat([sat]);
    });
    return {baslik:t.baslik,kolonlar:keep.map(i=>h[i]).concat(['FOOD Diğer Satılabilir Stok Adeti']),satirlar:all};
  };
  const v={baslik:'FOOD Diğer · '+(DD.donem||'')+' Satış Sıralaması',tablolar:src.tablolar.filter(t=>t.satirlar.length).map(mk)};
  _fdc.set(DD,v); return v;
}

async function loadImg(el,f){
  try{
    const r=await fetch('g_'+f.replace(/\.png$/i,'')+'.enc',{cache:'no-store'});
    if(!r.ok)throw 0;

    el.src=URL.createObjectURL(new Blob([plain],{type:'image/webp'}));
  }catch(e){el.alt='Görsel yüklenemedi'}
}

/* ---- kategori tablosundan sütun dizinleri (tek kaynak) ---- */
const _ki=new WeakMap();
function katInfo(k,DD){
  DD=DD||D; let c=_ki.get(DD); if(!c){c={};_ki.set(DD,c)}
  if(k in c)return c[k];
  const C=k==='FOOD Diğer'?fdKategori(DD):DD.kategoriler[k];
  const T=C?C.tablolar.filter(t=>t.satirlar.length):[], t=T[1];
  if(!t){c[k]=null;return null}
  const h=t.kolonlar, ix=n=>h.indexOf(n);
  const sub=x=>k==='VC'?/Bagless \+ Unlimited|Robot/.test(x):k==='FOOD'?/MUM/.test(x):true;
  const idxs=re=>h.map((x,i)=>re.test(x)?i:-1).filter(i=>i>=0);
  let main=h.findIndex(x=>/Satış Adeti|Toplam Adet|^Toplam|Tam Otomatik/.test(x)&&!/Tahmini|Ort\.|Stok/.test(x));
  if(main<0)main=ix('Bölge')+1;
  const pm=oncekiAy(DD);
  const info={k,h,C,t,spv:T[0],
    rows:t.satirlar.filter(r=>!isTot(r)&&r[ix('Kod')]),tot:t.satirlar.find(isTot),
    i:{kod:ix('Kod'),name:ix('Mağaza'),spv:ix('SPV'),bolge:ix('Bölge'),rank:ix('Sıra'),per:ix('Personel'),main,
      fcs:idxs(/^Ay Sonu Tahmini/).filter(i=>sub(h[i])),
      sat:h.findIndex(x=>/Satılabilir/i.test(x)),
      gel:idxs(/Gelen|Açık Sipariş/i).filter(i=>k==='FOOD'?/MUM/.test(h[i]):true),
      bas:idxs(/Başlangıç/).filter(i=>!/Set|Sınırlayan/.test(h[i])&&sub(h[i])),
      ays:idxs(/Satış/).filter(i=>h[i].startsWith(pm+' ')&&!/Başlangıç/.test(h[i])&&sub(h[i]))}};
  c[k]=info; return info;
}

const _ml=new WeakMap();
function magList(DD){
  DD=DD||D; if(_ml.has(DD))return _ml.get(DD);

  KATS.forEach(k=>{const I=katInfo(k,DD); if(!I)return; const q=I.i;
    I.rows.forEach(r=>{
      const kod=r[q.kod]; let m=mp.get(kod);
      if(!m){m={kod,ad:sade(r[q.name]),spv:r[q.spv],bolge:r[q.bolge],k:{}};mp.set(kod,m)}
      m.k[k]={main:N(r[q.main]),fc:q.fcs.length?sm(r,q.fcs):null,sat:q.sat>=0?N(r[q.sat]):null,gel:sm(r,q.gel),
        rank:q.rank>=0?r[q.rank]:null,per:q.per>=0?r[q.per]:null,bas:q.bas.map(i=>r[i]),ay:q.ays.length?sm(r,q.ays):null};
    });

  const arr=[...mp.values()];
  arr.forEach(m=>{m.top=KATS.reduce((a,k)=>a+(m.k[k]?m.k[k].main:0),0);m.topfc=KATS.reduce((a,k)=>a+(m.k[k]&&m.k[k].fc?m.k[k].fc:0),0)});

function stoksuzCokSatan(bolge){   // geçen ay ≥2 satan ama satılabilir stoğu olmayan (ürün × mağaza)
  const U=D.urunler; if(!U)return null;
  const agg=new Map(); let cift=0;
  U.r.forEach(r=>{const m=U.m[r[1]]; if(!m||m[1]==='ONLINE'||(bolge&&m[1]!==bolge))return; if(r[7]>=2&&r[5]<=0){cift++;const a=agg.get(r[0])||{u:r[0],g:0,n:0,kod:[]};a.g+=r[7];a.n++;a.kod.push(r[1]);agg.set(r[0],a)}});

  const list=[...hit.values()].sort((a,b)=>b.adet-a.adet||b.sat-a.sat);
  s+=`<div class="note" style="margin:0 0 8px">${list.length} ürün${list.length>40?' (ilk 40 gösteriliyor)':''} · kartı aç: mağaza dağılımı</div>`;
  if(!list.length)return s+'<div class="msg">Eşleşen ürün yok.</div>';
  s+=list.slice(0,40).map(a=>{
    const rows=a.rows.slice().sort((x,y)=>y[3]-x[3]||y[5]-x[5]).slice(0,80);
    return `<details class="card"><summary><div class="nm"><b style="white-space:normal">${esc(U.u[a.u])}</b><span>${esc(U.k[a.k])}</span></div>
      <div class="kv"><small>Sell-out</small><b>${nf(a.adet)}</b><span class="stk">Satılabilir stok ${nf(a.sat)}</span><span class="stk">Açık sipariş ${nf(a.gel)}</span></div></summary>
      <div class="det" style="display:block"><div class="urow h"><span>Mağaza</span><span>Sell-out</span><span>Satılabilir</span><span>Sipariş</span></div>`+
      rows.map(r=>{const m=U.m[r[1]]||[r[1],'',''];return `<div class="urow ${m[1]===GAB?'gar':''}" data-mk="${r[1]}"><span>${esc(m[0])}</span><span>${r[3]}</span><span>${r[5]}</span><span>${r[6]}</span></div>`}).join('')+`</div></details>`;
  }).join('');
  return s;
}

/* ---- Özet: uyarılar ---- */
function uyarilar(){
  const ga=magList().arr.filter(m=>m.bolge===GAB); if(!ga.length)return {html:'',metin:''};
  const it=[], tx=[];
  // 1) ay sonuna yetmeyen stok
  const yet=[]; KATS.forEach(k=>{const l=ga.filter(m=>m.k[k]&&m.k[k].bas.some(v=>typeof v==='number'&&v<0)); if(l.length)yet.push([k,l])});
  if(yet.length){
    const oz=yet.map(([k,l])=>`${KLAB[k]||k}: ${l.length}`).join(' · ');
    it.push(`<details><summary><span class="dot org"></span><span class="dt">Ay sonuna yetmeyen stok<small>${esc(oz)} mağaza</small></span></summary><div class="dl">`+
      yet.map(([k,l])=>`<div class="dk"><b>${esc(KLAB[k]||k)}</b> ${l.map(m=>`<a class="lnk" data-mk="${m.kod}">${esc(m.ad)}</a>`).join(' · ')}</div>`).join('')+'</div></details>');
    tx.push('• Ay sonuna yetmeyen stok → '+oz+' mağaza');
  }
  // 2) stoksuz çok satan
  const z=stoksuzCokSatan(GAB);
  if(z&&z.cift){
    it.push(`<details><summary><span class="dot red"></span><span class="dt">Stoksuz çok satan ürün<small>${z.liste.length} ürün · ${z.cift} mağaza-ürün</small></span></summary><div class="dl">`+
      z.liste.slice(0,8).map(a=>`<div class="dk"><a class="lnk" data-ara="${a.u}">${esc(D.urunler.u[a.u])}</a> <small>${a.n} mağaza · geçen ay ${a.g}</small></div>`).join('')+'</div></details>');
    tx.push(`• Stoksuz çok satan: ${z.liste.length} ürün (${z.cift} mağaza-ürün)`);
  }
  // 3) tahmin geçen ayın altında
  const low=[]; KATS.forEach(k=>{let a=0,b=0;ga.forEach(m=>{const x=m.k[k];if(x&&x.fc!=null&&x.ay!=null){a+=x.fc;b+=x.ay}});if(b>=20&&a/b-1<=-0.1)low.push([k,a,b])});
  if(low.length){
    const oz=low.map(([k,a,b])=>`${KLAB[k]||k} %${Math.round((1-a/b)*100)} altında`).join(' · ');
    it.push(`<div class="dsat"><span class="dot yel"></span><span class="dt">Tahmin geçen ayın altında<small>${esc(oz)}</small></span></div>`);
    tx.push('• Tahmin geçen ayın altında → '+oz);
  }
  // 4) transfer
  const t0=D.transfer&&D.transfer.filter(t=>t.satirlar.length)[0];
  if(t0){const h=t0.kolonlar,a=h.indexOf('Stoksuz model'),b=h.indexOf('Karşılanamayan');let sa=0,sb=0;t0.satirlar.forEach(r=>{sa+=N(r[a]);sb+=N(r[b])});
    if(sa||sb){it.push(`<div class="dsat" data-go="trf"><span class="dot org"></span><span class="dt">Transfer<small>${nf(sa)} stoksuz model · ${nf(sb)} adet karşılanamıyor</small></span><span class="chev">›</span></div>`);tx.push(`• Transfer: ${nf(sa)} stoksuz model, ${nf(sb)} adet karşılanamıyor`)}}
  return {html:it.length?`<div class="card dik"><div class="dhd">Dikkat · Güney Anadolu</div>${it.join('')}</div>`:'',metin:tx.join('\n')};
}
function gaToplam(DD,i){const r=DD.ozet[0]&&DD.ozet[0].satirlar.find(isGA);return r?N(r[DD.ozet[0].kolonlar.findIndex(x=>/^Toplam/.test(x))]):null}

/* ---- Daha: görseller · gidişat · personel ---- */
function vDaha(){
  const sub=sel.dh||'';
  const back='<div class="row" style="margin-bottom:8px"><button class="chip" data-back="dh">← Geri</button></div>';
  if(sub==='img')return back+vImg();
  if(sub==='gid')return back+vGid();
  if(sub==='per')return back+vPer();
  return [['img','▣','Görseller','6 tablo görseli (MDA, Ankastre, VC, FOOD, FAEM, Hava)'],
          ['gid','↗','Gidişat','Önceki rapora göre günlük satış, sıra ve tahmin değişimi'],
          ['per','☺','Personel','Mağaza × departman promotör durumu']]
    .map(([k,ic,b,t])=>`<div class="card"><div class="sm" data-dh="${k}"><div class="rk">${ic}</div><div class="nm"><b>${b}</b><span style="white-space:normal">${t}</span></div><span class="chev">›</span></div></div>`).join('');
}
function vGid(){
  if(!P)return '<div class="msg">Karşılaştırma için önceki gün raporu gerekiyor.<br>Bir sonraki günlük rapordan itibaren burada görünecek.</div>';
  const kk=KATS.includes(sel.gk)?sel.gk:KATS[0], rg=sel.grg||'';
  const A=magList(), B=magList(P);
  const rows=A.arr.filter(m=>(!rg||m.bolge===rg)&&m.k[kk]).map(m=>{
    const x=m.k[kk], pb=B.map.get(m.kod), y=pb&&pb.k[kk]; if(!y)return null;
    return {m,x,y,d:x.main-y.main,dfc:(x.fc!=null&&y.fc!=null)?x.fc-y.fc:null,dsat:(x.sat!=null&&y.sat!=null)?x.sat-y.sat:null,dr:(x.rank&&y.rank)?y.rank-x.rank:0};
  }).filter(Boolean).sort((a,b)=>b.d-a.d);
  const tp=rows.reduce((a,r)=>a+r.d,0), tf=rows.reduce((a,r)=>a+N(r.dfc),0);
  let s=`<div class="note" style="margin:0 0 8px">${esc(P.donem||'önceki')} → ${esc(D.donem||'şimdi')}</div>`;
  s+=chips(KATS.map(x=>[x,KLAB[x]||x]),kk,'gk')+bolgeChips('grg',rg);
  s+=`<div class="card dep"><div class="g4" style="grid-template-columns:repeat(2,1fr)"><div><small>Son rapordan bu yana satış</small><b>${sg(tp)}</b></div><div><small>Tahmin değişimi</small><b class="or">${sg(tf)}</b></div></div></div>`;
  s+=rows.map(r=>{
    const ar=r.dr>0?`<span class="pos">▲${r.dr}</span>`:r.dr<0?`<span class="neg">▼${-r.dr}</span>`:'<span style="color:var(--mut)">=</span>';
    return `<div class="card ${r.m.bolge===GAB?'ga':''}" data-mk="${r.m.kod}"><div class="sm"><div class="rk" style="font-size:11px">${r.x.rank||''}</div><div class="nm"><b>${esc(r.m.ad)}</b><span>${ar} sıra · ${esc(r.m.spv)}</span></div>
      <div class="kv"><small>Satış</small><b class="${r.d>0?'pos':''}">${sg(r.d)}</b>${r.dfc!=null?`<span class="stk">Tahmin ${sg(r.dfc)}</span>`:''}${r.dsat!=null?`<span class="stk">Satılabilir ${sg(r.dsat)}</span>`:''}</div></div></div>`;
  }).join('');
  return s;
}
function vPer(){
  const rg=sel.prg||'', q=(sel.q||'').toLocaleLowerCase('tr'), DEP=['MDA','VC','FOOD','FAEM'];
  const rows=magList().arr.filter(m=>(!rg||m.bolge===rg)&&(!q||m.ad.toLocaleLowerCase('tr').includes(q)))
    .sort((a,b)=>(ORD.indexOf(a.bolge)-ORD.indexOf(b.bolge))||a.ad.localeCompare(b.ad,'tr'));
  const cnt={}; DEP.forEach(k=>{cnt[k]={var:0,dol:0,acik:0,yok:0};rows.forEach(m=>{const c=perCls(m.k[k]&&m.k[k].per);if(cnt[k][c]!=null)cnt[k][c]++})});
  let s=`<input type="search" id="q" placeholder="Mağaza ara…" value="${esc(sel.q||'')}">`+bolgeChips('prg',rg);
  s+='<div class="card dep"><div class="g4">'+DEP.map(k=>`<div><small>${k}</small><b>${cnt[k].var+cnt[k].dol}<span style="font-size:12px;color:var(--mut)">/${rows.length}</span></b><small style="text-transform:none">${cnt[k].acik?cnt[k].acik+' açık nokta · ':''}${cnt[k].yok} yok</small></div>`).join('')+'</div></div>';
  s+='<div class="note" style="margin:0 0 8px">Var = promotör var · dolaylı: FAEM\'ci/VC\'ci aynı işi yapıyor · açık nokta: personel aranıyor</div>';
  s+='<div class="tw"><table><thead><tr><th>Mağaza</th>'+DEP.map(k=>`<th>${k}</th>`).join('')+'</tr></thead><tbody>'+
    rows.map(m=>`<tr class="${m.bolge===GAB?'ga':''}" data-mk="${m.kod}"><td>${esc(m.ad)}</td>`+DEP.map(k=>{const x=m.k[k];return `<td><span class="pb ${perCls(x&&x.per)}">${esc(perTxt(x&&x.per))}</span></td>`}).join('')+'</tr>').join('')+'</tbody></table></div>';
  return s;
}

/* ---- paylaşım metinleri ---- */
function paylasMetin(kind,arg){
  const vt=veriTarihi(D.donem);
  if(kind==='ozet'){
    const ga=magList().arr.filter(m=>m.bolge===GAB);
    let t=`BSH · Güney Anadolu · ${vt} (${D.donem})\n`;
    const a=gaToplam(D);
    if(a!=null)t+=`Toplam sell-out: ${nf(a)}\n`;
    KATS.forEach(k=>{const s1=ga.reduce((x,m)=>x+(m.k[k]?m.k[k].main:0),0),s2=ga.reduce((x,m)=>x+(m.k[k]&&m.k[k].fc?m.k[k].fc:0),0);if(s1||s2)t+=`${KLAB[k]||k}: ${nf(s1)} (tahmin ${nf(s2)})\n`});
    const u=uyarilar().metin; if(u)t+='\n'+u;
    return t.trim();
  }
  if(kind==='mag'){
    const m=magList().map.get(arg); if(!m)return '';
    let t=`${m.ad} · ${vt}\n${m.spv} · ${tc(m.bolge)}\n`;
    KATS.forEach(k=>{const x=m.k[k]; if(x)t+=`${KLAB[k]||k}: sell-out ${nf(x.main)} · tahmin ${x.fc!=null?nf(x.fc):'–'} · satılabilir stok ${x.sat!=null?nf(x.sat):'–'} · açık sipariş ${nf(x.gel)}\n`});
    return t.trim();
  }
  if(kind==='kat'){
    const keys=KATS.filter(k=>katInfo(k)), k=keys.includes(sel.kat)?sel.kat:keys[0], I=katInfo(k), rg=sel.rg||'', q=(sel.q||'').toLocaleLowerCase('tr');
    const rows=I.rows.filter(r=>(!rg||r[I.i.bolge]===rg)&&(!q||String(r[I.i.name]).toLocaleLowerCase('tr').includes(q))).slice(0,15);
    let t=`${KLAB[k]||k} · ${rg?tc(rg):'Türkiye'} · ${vt}\n`;
    rows.forEach((r,i)=>{t+=`${r[I.i.rank]||i+1}. ${sade(r[I.i.name])} — ${nf(r[I.i.main])}`+(I.i.fcs.length?` (tahmin ${nf(I.i.fcs.reduce((a,j)=>a+N(r[j]),0))})`:'')+'\n'});
    return t.trim();
  }
  return '';
}

/* ---------- çizim ---------- */
function render(){
  if(!D)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const y=window.scrollY;
  M.innerHTML=({ozet:vOzet,kat:vKat,mag:vMag,urun:vUrun,trf:vTrf,daha:vDaha}[tab]||vOzet)();
  bindChips();
  const q=$('#q'); if(q)q.oninput=()=>{sel.q=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const go=(t,fn)=>{tab=t;LS.set('tab',t);if(fn)fn();render();window.scrollTo(0,0)};
  M.querySelectorAll('[data-mk]').forEach(el=>el.onclick=e=>{e.stopPropagation();const k=el.dataset.mk;go('mag',()=>{sel.mk=k})});
  M.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(b.dataset.back==='mk')sel.mk=null;if(b.dataset.back==='dh')sel.dh='';render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-dh]').forEach(el=>el.onclick=()=>{sel.dh=el.dataset.dh;render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-ara]').forEach(el=>el.onclick=()=>go('urun',()=>{sel.q=D.urunler.u[+el.dataset.ara];sel.urg=GAB}));
  M.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  M.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{const t=paylasMetin(b.dataset.sh,b.dataset.arg);if(t)paylas(t)});
  M.querySelectorAll('.imgs img').forEach(im=>{loadImg(im,im.dataset.f);im.onclick=()=>{$('#zoom img').src=im.src;$('#zoom').style.display='block'}});
  window.scrollTo(0,y);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;LS.set('tab',tab);sel.q='';if(tab==='mag')sel.mk=null;if(tab==='daha')sel.dh='';window.scrollTo(0,0);render()});
$('#zoom button').onclick=()=>{$('#zoom').style.display='none'};
$('#rf').onclick=()=>load(true);
$('#st').onclick=()=>{if(confirm('Çıkış yapılsın mı? (Şifre bu cihazdan silinir)')){LS.del('pw');LS.del('cache_enc');D=null;KEY=null;gate()}};
/* tema: Otomatik (telefon ayarı) → Açık → Koyu */
const TEMA=['auto','light','dark'], TIC={auto:'◐',light:'☀',dark:'☾'}, TAD={auto:'Otomatik',light:'Açık',dark:'Koyu'};
let _tt=0;
function temaUygula(t,bildir){
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  $('#th').textContent=TIC[t]; $('#th').title='Tema: '+TAD[t]; LS.set('tema',t);
  if(bildir){const e=$('#toast');e.textContent='Tema: '+TAD[t];e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),1400)}
}
$('#th').onclick=()=>{const c=LS.get('tema')||'auto';temaUygula(TEMA[(TEMA.indexOf(c)+1)%3],true)};
temaUygula(LS.get('tema')||'auto');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* yeni sürüm uyarısı: index.html'deki surum numarası çalışandan farklıysa şerit göster */
const SURUM=(document.querySelector('meta[name=surum]')||{}).content;
async function surumKontrol(){
  try{
    const t=await (await fetch('index.html?'+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/name="surum" content="([^"]+)"/);
    if(m&&SURUM&&m[1]!==SURUM)$('#upd').hidden=false;
  }catch(e){}
}
const guncelle=async()=>{
  try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
  location.replace(location.pathname+'?s='+Date.now());
};
$('#updgo').onclick=guncelle; $('#gn').onclick=guncelle;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')surumKontrol()});
surumKontrol();
load();
</script>
