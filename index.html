<script>
'use strict';
const $=s=>document.querySelector(s), M=$('#m');
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let D=null, P=null, sel={}, mode='', SALTB='';
let tab=LS.get('tab'); if(!['ozet','kat','mag','urun','trf','daha'].includes(tab))tab='ozet';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isGA=r=>r.some(c=>typeof c==='string'&&/G[ÜU]NEY ANADOLU/i.test(c));
const isTot=r=>r.some(c=>typeof c==='string'&&/TOPLAM/.test(c));

/* ---------- sayı biçimi ---------- */
function fmt(v,h){
  if(v==null||v==='')return '–';
  if(typeof v==='string')return esc(v);
  h=h||'';
  if(/Payı|İHS/.test(h)&&Math.abs(v)<=1.5)return (v*100).toFixed(1).replace('.',',')+'%';
  if(/Tempo|vs |Tahmin vs/.test(h)&&Math.abs(v)<20){const p=Math.round(v*100);return (p>0?'+':'')+p+'%'}
  if(/Devir/.test(h))return v.toFixed(2).replace('.',',');
  if(Number.isInteger(v))return v.toLocaleString('tr-TR');
  return Math.abs(v)<100?v.toFixed(1).replace('.',','):Math.round(v).toLocaleString('tr-TR');
}
const sgn=(v,h)=>/Tempo|vs /.test(h||'')&&typeof v==='number'?(v>0?'pos':v<0?'neg':''):(typeof v==='number'&&v<0?'neg':'');

/* ---------- veri yükleme (şifreli) ---------- */
let KEY=null, SALT=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function gunzip(buf){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
async function openPack(text,pw,reuse){
  const p=JSON.parse(text);
  const key=(reuse&&KEY&&SALTB===p.salt)?KEY:await deriveKey(pw,b64(p.salt),p.iter);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));   // yanlış şifrede hata verir
  if(!reuse){KEY=key;SALTB=p.salt}
  return JSON.parse(new TextDecoder().decode(await gunzip(plain)));
}
async function load(force){
  M.innerHTML='<div class="msg">Yükleniyor…</div>';
  const pw=LS.get('pw');
  if(!pw)return gate();
  let text=null, offline=false;
  try{
    const r=await fetch('veri.enc?'+(force?Date.now():''),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    text=await r.text(); LS.set('cache_enc',text);
  }catch(e){text=LS.get('cache_enc');offline=true}
  if(!text){M.innerHTML='<div class="msg">Veri alınamadı. İnterneti kontrol edip ↻ ye bas.</div>';return}
  try{
    D=await openPack(text,pw);
    P=null;
    try{const r2=await fetch('onceki.enc?'+Date.now(),{cache:'no-store'});if(r2.ok)P=await openPack(await r2.text(),pw,true)}catch(e){}
    done(offline?'Çevrimdışı: son kaydedilen veri gösteriliyor.':'');
  }catch(e){LS.del('pw');gate('Şifre yanlış ya da değişmiş. Yeniden gir.')}
}
function gate(err){
  $('#sub').textContent='şifre gerekli';
  M.innerHTML=`<div class="setup"><b>Şifre</b>
  <p class="note" style="margin-top:6px">Raporu görmek için sana verilen şifreyi gir. Bu cihazda hatırlanır.</p>
  ${err?`<p class="neg">${esc(err)}</p>`:''}
  <input id="pw" type="password" placeholder="Şifre" autocomplete="current-password">
  <button class="go" id="pwgo">Aç</button></div>`;
  const go=()=>{const v=$('#pw').value;if(v){LS.set('pw',v);load(true)}};
  $('#pwgo').onclick=go; $('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
const AYNO={ocak:1,'şubat':2,mart:3,nisan:4,'mayıs':5,haziran:6,temmuz:7,'ağustos':8,'eylül':9,ekim:10,'kasım':11,'aralık':12};
function veriTarihi(d){  // "1-11 Kasım 2026" -> "11.11.2026" (verinin son günü)
  const m=String(d||'').match(/(\d+)(?:\s*-\s*(\d+))?\s+(\S+)\s+(\d{4})/); if(!m)return '';
  const ay=AYNO[m[3].toLocaleLowerCase('tr')]; if(!ay)return '';
  return String(m[2]||m[1]).padStart(2,'0')+'.'+String(ay).padStart(2,'0')+'.'+m[4];
}
function done(note){
  const vt=veriTarihi(D.donem); $('#ttl').textContent='Ham Data'+(vt?' · '+vt:'');
  $('#sub').textContent=(D.donem||'')+' · güncelleme '+(D.olusturma||'');
  render();
  if(note)M.insertAdjacentHTML('afterbegin',`<div class="note">${esc(note)}</div>`);
}

/* ---------- ortak bileşenler ---------- */
function table(t,opts){
  opts=opts||{};
  const h=t.kolonlar;
  let s='<div class="tw"><table><thead><tr>'+h.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';
  for(const r of t.satirlar){
    s+=`<tr class="${isGA(r)?'ga':''} ${isTot(r)?'tot':''}">`+h.map((x,i)=>{const hh=i>1?x+' '+(r[0]||''):x;return `<td class="${sgn(r[i],hh)}">${fmt(r[i],hh)}</td>`}).join('')+'</tr>';
  }
  return s+'</tbody></table></div>';
}
function chips(items,cur,key){
  return '<div class="chips">'+items.map(([id,label])=>`<button class="chip ${id===cur?'on':''}" data-k="${key}" data-v="${esc(id)}">${esc(label)}</button>`).join('')+'</div>';
}
function bindChips(){
  M.querySelectorAll('.chip[data-k]').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=b.dataset.v;if(b.dataset.k==='bs'||b.dataset.k==='bm')sel.q='';render()});
}
/* kart içi kolonları başlıklı gruplara ayır: mağaza bilgisi · Sell-out · Satılabilir stok · Açık sipariş · Ay başı */
const GRUP=[['Sell-out'],['Satılabilir stok'],['Açık sipariş'],['Ay başı stok']];
function grpAd(x){
  if(/Gelen|Açık Sipariş/i.test(x))return 3;
  if(/Başlangıç/i.test(x))return 4;
  if(/Satılabilir|Stok|Set (Siyah|Beyaz|Gri|Inox)|Devir/i.test(x))return 2;
  if(/^(Sıra|Kod|Personel|SPV|Bölge|Mağaza)$/i.test(x))return 0;
  return 1;
}
function grupla(h,r,nameIdx){
  const g={0:[],1:[],2:[],3:[],4:[]};
  h.forEach((x,i)=>{
    if(r[i]==null||r[i]===''||i===nameIdx)return;
    g[grpAd(x)].push({x,i,sat:/Satılabilir/i.test(x)?0:1});
  });
  g[2].sort((a,b)=>a.sat-b.sat||a.i-b.i);          // satılabilir stok önce
  const row=e=>`<i>${esc(e.x)}</i><b class="${sgn(r[e.i],e.x)}">${fmt(r[e.i],e.x)}</b>`;
  let s=g[0].map(row).join('');
  [[1,'Sell-out'],[2,'Satılabilir stok'],[3,'Açık sipariş'],[4,'Ay başı stok']].forEach(([k,t])=>{ if(g[k].length)s+=`<h4>${t}</h4>`+g[k].map(row).join('') });
  return s;
}
const KATVERI={'MDA':['MDA'],'Ankastre':['Ankastre'],'VC':['VC Bagless+Unlimited','VC Robot'],'FOOD':['FOOD MUM'],'FOOD Diğer':['FOOD Diğer'],'FAEM':['FAEM'],'Hava Temizleyici':['Hava Temizleyici']};
function cihazlar(kod,cats){   // mağazanın satılabilir stoğunu ve açık siparişini oluşturan cihazlar
  const ux=urunIdx(); if(!ux||!cats)return '';
  const U=D.urunler, ok=new Set(cats.map(c=>U.k.indexOf(c)).filter(i=>i>=0));

/* FOOD Diğer: FOOD sayfasından türetilen ayrı kategori (sıralama FOOD Diğer satışına göre) */
const _fdc=new WeakMap();
function fdKategori(DD){
  DD=DD||D; if(_fdc.has(DD))return _fdc.get(DD);
  const src=DD.kategoriler['FOOD']; if(!src)return null;
  const m=String(DD.donem||'').match(/(\d+)(?:\s*-\s*(\d+))?\s+(\S+)\s+(\d{4})/);
  const pd=m?+(m[2]||m[1]):1, ay=m?AYNO[m[3].toLocaleLowerCase('tr')]:0, lmd=ay?new Date(+m[4],ay-1,0).getDate():30;
  const isT=r=>r.some(c=>typeof c==='string'&&/TOPLAM/.test(c));
  const mk=t=>{
    const h=t.kolonlar, f=re=>h.findIndex(x=>re.test(x));
    const iR=f(/^Sıra$/), iM=f(/^FOOD Diğer Toplam/), iF=f(/^Ay Sonu Tahmini FOOD Diğer/), iG=f(/Gelen.*FOOD Diğer/), iB=f(/Başlangıç FOOD Diğer/), iP=f(/^TR Payı/), iT=f(/Tempo vs/), iE=f(/^[^ ]+ FOOD Diğer Satış Adeti$/);
    const rows=t.satirlar.map(r=>r.slice()), tot=rows.filter(isT), body=rows.filter(r=>!isT(r));
    body.sort((a,b)=>(b[iM]||0)-(a[iM]||0));
    let prev=null,rk=0; body.forEach((r,i)=>{if(r[iM]!==prev){rk=i+1;prev=r[iM]} if(iR>=0)r[iR]=rk});
    const tm=tot.length?tot[0][iM]:0, keep=h.map((x,i)=>i).filter(i=>!h[i].includes('MUM'));
    const all=body.concat(tot).map(r=>{
      const v=r[iM]||0, fc=r[iF]||0;
      if(iP>=0)r[iP]=tm?v/tm:null;
      if(iT>=0)r[iT]=r[iE]>0?(v/pd)/(r[iE]/lmd)-1:null;
      const sat=(r[iB]!=null&&r[iG]!=null)?r[iB]-r[iG]+Math.max(0,fc-v):null;
      return keep.map(i=>r[i]).concat([sat]);
    });
    return {baslik:t.baslik,kolonlar:keep.map(i=>h[i]).concat(['FOOD Diğer Satılabilir Stok Adeti']),satirlar:all};
  };
  const v={baslik:'FOOD Diğer · '+(DD.donem||'')+' Satış Sıralaması',tablolar:src.tablolar.filter(t=>t.satirlar.length).map(mk)};
  _fdc.set(DD,v); return v;
}

/* ---- kategori tablosundan sütun dizinleri (tek kaynak) ---- */
const _ki=new WeakMap();
function katInfo(k,DD){
  DD=DD||D; let c=_ki.get(DD); if(!c){c={};_ki.set(DD,c)}
  if(k in c)return c[k];
  const C=k==='FOOD Diğer'?fdKategori(DD):DD.kategoriler[k];
  const T=C?C.tablolar.filter(t=>t.satirlar.length):[], t=T[1];
  if(!t){c[k]=null;return null}
  const h=t.kolonlar, ix=n=>h.indexOf(n);
  const sub=x=>k==='VC'?/Bagless \+ Unlimited|Robot/.test(x):k==='FOOD'?/MUM/.test(x):true;
  const idxs=re=>h.map((x,i)=>re.test(x)?i:-1).filter(i=>i>=0);
  let main=h.findIndex(x=>/Satış Adeti|Toplam Adet|^Toplam|Tam Otomatik/.test(x)&&!/Tahmini|Ort\.|Stok/.test(x));
  if(main<0)main=ix('Bölge')+1;
  const pm=oncekiAy(DD);
  const info={k,h,C,t,spv:T[0],
    rows:t.satirlar.filter(r=>!isTot(r)&&r[ix('Kod')]),tot:t.satirlar.find(isTot),
    i:{kod:ix('Kod'),name:ix('Mağaza'),spv:ix('SPV'),bolge:ix('Bölge'),rank:ix('Sıra'),per:ix('Personel'),main,
      fcs:idxs(/^Ay Sonu Tahmini/).filter(i=>sub(h[i])),
      sat:h.findIndex(x=>/Satılabilir/i.test(x)),
      set:k==='Ankastre'?idxs(/^Set (Siyah|Beyaz|Gri|Inox)$/):[],
      gel:idxs(/Gelen|Açık Sipariş/i).filter(i=>k==='FOOD'?/MUM/.test(h[i]):true),
      bas:idxs(/Başlangıç/).filter(i=>!/Set|Sınırlayan/.test(h[i])&&sub(h[i])),
      ays:idxs(/Satış/).filter(i=>h[i].startsWith(pm+' ')&&!/Başlangıç/.test(h[i])&&sub(h[i]))}};
  c[k]=info; return info;
}
/* ---- otomatik yorum (kısa, net): mağaza × departman ---- */
function donemGun(DD){const m=String((DD||D).donem||'').match(/(\d+)(?:\s*-\s*(\d+))?\s+\S+\s+\d{4}/);return m?+(m[2]||m[1]):0}
const _tro=new WeakMap();

  if(k in c)return c[k];
  const I=katInfo(k); let v=0;
  if(I){const a=I.rows.filter(r=>r[I.i.bolge]!=='ONLINE'&&N(r[I.i.main])>0); v=a.length?a.reduce((s,r)=>s+N(r[I.i.main]),0)/a.length:0}

}

function yorumMag(m,k){
  const x=m.k[k]; if(!x)return null;
  const ort=trOrt(k), end=ort?Math.round(x.main/ort*100):0, gun=donemGun(), ay=oncekiAy(D);
  let d,cls;
  if(x.main===0)[d,cls]=(x.sat>0||x.gel>0||x.ay>0)?['Satış yok','t-red']:['Ürün yok','t-yel'];
  else if(end>=130&&x.main>=3)[d,cls]=['Güçlü','t-grn'];
  else if(end>=100)[d,cls]=['İyi','t-grn'];
  else if(end>=60)[d,cls]=['Gelişime açık','t-yel'];
  else[d,cls]=['Düşük','t-red'];
  let t=`${nf(x.main)} adet`+(x.rank?` (TR #${x.rank})`:'')+(ort&&x.main>0?`, ort. %${end}`:'');
  if(x.fc!=null&&x.ay>0){const p=Math.round((x.fc/x.ay-1)*100);t+=`. Tahmin ${nf(x.fc)}, ${ay}'de ${nf(x.ay)}: ${p>=0?'+':'−'}%${Math.abs(p)}`}
  else if(x.fc!=null)t+=`. Tahmin ${nf(x.fc)}`;
  const o=[], neg=x.bas.filter(v=>typeof v==='number'&&v<0);

    if(oos.length)o.push(`Stoksuz çok satan: ${oos.slice(0,2).map(r=>modelAd(U.u[r[0]])).join(', ')}${oos.length>2?' +'+(oos.length-2):''}: sipariş/transfer`);
    const dead=rows.filter(r=>r[3]===0&&r[7]===0&&r[5]>0).reduce((s,r)=>s+r[5],0);
    if(dead>=5)o.push(`${dead} adet satmayan stok: teşhir/fiyat`);
  }
  if(x.main===0&&x.sat>=3)o.push('Stok var satış yok: teşhir/yerleşim/promotör');
  const kap=(x.main>0&&gun&&x.sat>=10)?x.sat/(x.main/gun):0;
  if(kap>=120)o.push(`Stok ${Math.round(kap)} günlük: kampanya/transfer`);
  if(x.ay>0&&x.fc!=null&&x.fc/x.ay-1<=-.3)o.push('Tempo düşük: nedenini sorgula');
  const pc=perCls(x.per); if((pc==='yok'||pc==='acik')&&k!=='Ankastre'&&k!=='Hava Temizleyici'&&k!=='FOOD Diğer')o.push(pc==='acik'?'Açık nokta: promotör ata':'Promotör yok');

}

const _ml=new WeakMap();
function magList(DD){

    I.rows.forEach(r=>{

      m.k[k]={main:N(r[q.main]),fc:q.fcs.length?sm(r,q.fcs):null,sat:q.sat>=0?N(r[q.sat]):null,gel:sm(r,q.gel),
        set:q.set.length?q.set.map(i=>N(r[i])):null,rank:q.rank>=0?r[q.rank]:null,per:q.per>=0?r[q.per]:null,bas:q.bas.map(i=>r[i]),ay:q.ays.length?sm(r,q.ays):null};
    });
  });
  const arr=[...mp.values()];
  arr.forEach(m=>{m.top=KATS.reduce((a,k)=>a+(m.k[k]?m.k[k].main:0),0);m.topfc=KATS.reduce((a,k)=>a+(m.k[k]&&m.k[k].fc?m.k[k].fc:0),0)});

const _ux=new WeakMap();
function urunIdx(){

  const byKod=new Map(); U.r.forEach(r=>{let a=byKod.get(r[1]);if(!a){a=[];byKod.set(r[1],a)}a.push(r)});

function stoksuzCokSatan(bolge){   // geçen ay ≥2 satan ama satılabilir stoğu olmayan (ürün × mağaza)
  const U=D.urunler; if(!U)return null;

/* ---- BRAND mağaza karşılaştırması: bir mağazada ay ay, marka marka satış ---- */
let _bi=null;
const bTitle=s=>{s=String(s||'').trim();return s.length<=3?s:s.toLowerCase().replace(/(^|[\s&])\S/g,m=>m.toUpperCase())};
const bKey=n=>fold(String(n||'').replace(/^T\d{3}\s*-\s*/,'').replace(/^Media\s+/i,'')).replace(/\s+/g,'');
function brandCols(s){
  const R=s.satirlar, bas=Math.max(1,s.bas), n=R[0].length; let mj=-1; const b=[];
  for(let j=0;j<n;j++){
    for(let i=0;i<bas;i++)if(/^ma[ğg]aza$/i.test(String(R[i][j]||'').trim())){mj=j}
    const sub=[...Array(bas).keys()].some(i=>/sat[ıi][şs]\s*adedi/i.test(String(R[i][j]||'')));
    const br=R[0][j]; if(sub&&typeof br==='string'&&br.trim()&&!/sat[ıi][şs]\s*adedi/i.test(br))b.push([j,bTitle(br)]);
  }
  return {mj,b};
}
function brandIdx(){
  if(_bi&&_bi.src===BR)return _bi;
  const S=new Map(), AYL=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'], kodKey=new Map();
  BR.dosyalar.forEach(f=>f.sayfalar.forEach(s=>{const mj=brandCols(s).mj; if(mj<0)return; s.satirlar.slice(s.bas).forEach(r=>{const m=String(r[mj]||'').match(/^(T\d{3})\s*-/); if(m)kodKey.set(bKey(r[mj]),m[1])})}));
  const ayList=new Map();
  BR.dosyalar.forEach(f=>{
    if(!f.ay)return;
    const ak=f.yil*100+f.ay, kismi=/^\s*\d+\s*-\s*\d+/.test(f.ad);
    ayList.set(ak,{k:ak,t:AYL[f.ay-1]+' '+String(f.yil).slice(2)+(kismi?'*':'')});
    f.sayfalar.forEach(s=>{
      if(/KATEG/i.test(fold(s.ad)))return;
      const c=brandCols(s); if(c.mj<0||!c.b.length)return;
      const lab=fold(s.ad).replace(/\s+/g,'').toUpperCase(), ad=lab==='FLOORCARE'?'FloorCare':s.ad;
      s.satirlar.slice(s.bas).forEach(r=>{
        const nm=String(r[c.mj]||''); if(!nm||/TOPLAM/i.test(nm))return;
        const key=bKey(nm); let e=S.get(key);
        if(!e){e={key,ad:nm.replace(/^T\d{3}\s*-\s*/,'').replace(/^Media\s+/i,''),kod:kodKey.get(key)||'',m:new Map(),sy:new Map()};S.set(key,e)}
        let M=e.m.get(ak); if(!M){M=new Map();e.m.set(ak,M)}
        const o={}; c.b.forEach(([j,b])=>{const v=r[j]; if(typeof v==='number')o[b]=v}); M.set(lab,o); e.sy.set(lab,ad);
      });
    });
  });
  _bi={src:BR,S,ayList:[...ayList.values()].sort((a,b)=>a.k-b.k)}; return _bi;
}

/* ===================== ihtiyaç listeleri · mini grafik · yeni transfer ===================== */
const IHT={ankastre:'Ankastre',vc:'VC',food:'FOOD',faem:'FAEM'};
const IHTDEP={vc:'VC',food:'FOOD',faem:'FAEM'};
function ihtSatirlar(tip){
  const T=D.ihtiyac&&D.ihtiyac[tip==='ankastre'?'ankastre':'sda']; if(!T)return null;
  const h=T.kolonlar, b=T.bant, f=re=>h.findIndex(x=>re.test(x));
  const dn=IHTDEP[tip];   // VC / FOOD / FAEM (SDA listesinden ayrı ayrı)
  let model0, sip;
  if(tip==='ankastre'){sip=[f(/^Sipariş verilecek/)];model0=f(/^(Ocak|Fırın|Davlumbaz)\s/)}
  else{sip=[f(/^VC sipariş/),f(/^FOOD sipariş/),f(/^FAEM sipariş/)];model0=Math.max(...sip)+1}
  if(model0<0)return null;
  const di=dn?['VC','FOOD','FAEM'].indexOf(dn):-1, pi=dn?f(new RegExp('^'+dn+' personel')):-1;
  const rows=T.satirlar.filter(r=>/^T\d{3}/.test(r[0]||'')).map(r=>{
    const parts=[]; for(let i=model0;i<h.length;i++){if(dn&&b[i]!==dn)continue;const v=N(r[i]); if(v>0)parts.push({g:b[i]||'',ad:h[i],v})}
    const tot=dn?(sip[di]>=0?N(r[sip[di]]):0):sip.reduce((a,i)=>a+(i>=0?N(r[i]):0),0);
    return {kod:r[0],ad:sade(r[1]),spv:r[2],bolge:r[3],tot,per:pi>=0?r[pi]:null,parts,r};
  });
  return {h,rows,f};
}
function partsHtml(parts,baslik){
  const g=new Map(); parts.forEach(p=>{if(!g.has(p.g))g.set(p.g,[]);g.get(p.g).push(p)});
  return [...g.entries()].map(([k,l])=>`<div class="dk">${baslik?`<b>${esc(k)}</b><br>`:''}`+l.map(p=>`<span class="pill">${esc(p.ad)} <b>${p.v}</b></span>`).join(' ')+'</div>').join('');
}
function ihtDetay(tip,x,S){
  let s='';

    const f=S.f, r=x.r, g=n=>{const i=f(new RegExp('^'+n+'$'));return i>=0?N(r[i]):0};

  let pg=0,pv=0; const pts=[];
  G.gunler.forEach(g=>{const v=val(g.m[kod]),n=g.gun-pg;if(n>0)pts.push({gun:g.gun,d:(v-pv)/n,n,v});pg=g.gun;pv=v});
  const mm=String(D.donem||'').match(/\s(\S+)\s+\d{4}/), ay=mm?AYNO[mm[1].toLocaleLowerCase('tr')]:0;
  const AB=(['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][ay-1])||'';
  const n=pts.length, last=pts[n-1]||{d:0,gun:0,v:0}, prev=n>1?pts[n-2]:null;
  const avg=last.gun?last.v/last.gun:0, mxv=Math.max(0,...pts.map(p=>p.d)), peak=pts.find(p=>p.d===mxv)||last;
  const nice=x=>{if(x<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e};
  const top=nice(Math.max(mxv,avg,1)), W=320, H=156, L=30, R=8, T=18, B=28, ch=H-T-B, cw=W-L-R, y=v=>T+ch-(v/top)*ch;
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Günlük satış grafiği">`;
  [0,0.5,1].forEach(f=>{const yy=y(top*f);svg+=`<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${(yy+3).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--mut)">${fmtD(top*f)}</text>`});
  const slot=cw/Math.max(n,1), bw=Math.min(36,slot*0.62);
  pts.forEach((p,i)=>{
    const x=L+slot*i+(slot-bw)/2, yy=y(Math.max(p.d,0)), hh=Math.max(1.5,T+ch-yy), son=i===n-1;
    svg+=`<rect x="${x.toFixed(1)}" y="${(T+ch-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" fill="${son?'var(--org)':'var(--ga-line)'}" opacity="${son?1:.7}"/>`;
    if(n<=14)svg+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ch-hh-4).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ink)">${fmtD(p.d)}</text>`;
    if(n<=16||i===0||i===n-1||i%2===0)svg+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-13}" font-size="9" text-anchor="middle" fill="var(--mut)">${p.gun}</text>`;
  });
  svg+=`<text x="${L}" y="${H-2}" font-size="9" fill="var(--mut)">${esc(AB)} · rapor bitiş günü</text>`;
  if(n>1){const ya=y(avg);svg+=`<line x1="${L}" x2="${W-R}" y1="${ya.toFixed(1)}" y2="${ya.toFixed(1)}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3" opacity=".55"/><text x="${L+3}" y="${(ya-3).toFixed(1)}" font-size="9" text-anchor="start" fill="var(--mut)">ay ort. ${fmtD(avg)}</text>`}
  svg+='</svg>';
  let dl='';
  if(prev&&prev.d>0){const p=Math.round((last.d/prev.d-1)*100);dl=`<span class="${p>=0?'pos':'neg'}" style="font-size:12px;font-weight:600">${p>=0?'▲':'▼'} %${Math.abs(p)}</span>`}
  const stat=n?`<div class="g4" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px">
    <div><small>Son aralık</small><b class="or">${fmtD(last.d)}</b>${dl?`<div>${dl}</div>`:''}</div>
    <div><small>Ay ortalaması</small><b>${fmtD(avg)}</b></div>
    <div><small>En yüksek</small><b>${fmtD(mxv)}</b><div style="font-size:11px;color:var(--mut)">${peak.gun} ${esc(AB)}</div></div></div>`:'';
  return `<h2>Günlük satış (adet/gün)</h2><div class="card dep">`+chips([['','Toplam']].concat(G.kat.map(k=>[k,KLAB[k]||k])),gc,'gc')+stat+(n?svg:'')+
    `<div class="note" style="margin:6px 0 0">Her çubuk, iki rapor arasındaki günlük ortalama satış.${n<2?' Günler geçtikçe çubuklar çoğalacak; ilk çubuk ayın başından bu güne ortalamadır.':''}</div></div>`;
}

/* ---- Transfer (yeniden) ---- */
function kaynakParse(s){if(!s)return null;const m=String(s).match(/^(T\d{3})\s+(.*?)\s+·\s+~?(\d+)\s+ad(?:\s+\((.*)\))?/);return m?{kod:m[1],ad:m[2],adet:m[3],not:m[4]||''}:null}
function kaynakHtml(s,adet){
  if(!s)return '';
  let k=kaynakParse(s);
  if(!k){const m=String(s).match(/^(T\d{3})\s+(.*?)(?:\s+\((.*)\))?$/); if(m)k={kod:m[1],ad:m[2],adet:adet!=null?adet:'',not:m[3]||''}}
  if(!k)return `<span>${esc(s)}</span>`;
  const var_=magList().map.has(k.kod);
  return `${var_?`<a class="lnk" data-mk="${k.kod}">${esc(k.kod+' '+k.ad)}</a>`:esc(k.kod+' '+k.ad)}${k.adet!==''?` · <b>${k.adet} ad</b>`:''}${k.not?` <small style="color:var(--mut)">(${esc(k.not)})</small>`:''}`;
}
function vTrf(){
  const T=D.transfer.filter(t=>t.satirlar.length);
  if(!T.length)return '<div class="msg">Transfer verisi yok.</div>';
  const cur=sel.tr!=null?sel.tr:'0';
  let s=chips([['0','Mağaza özeti'],['1','İhtiyaç / kaynak'],['2','Satmayan stok']],cur,'tr');
  const t=T[+cur]; if(!t)return s;
  const h=t.kolonlar, f=re=>h.findIndex(x=>re.test(x));
  const short=m=>sade(m);
  if(+cur===0){
    const iM=f(/^Mağaza$/), a=f(/^Stoksuz model/), b=f(/^Kritik/), c=f(/^Düşük/), d=f(/^İhtiyaç adet/), e=f(/^Önerilen transfer/), g=f(/^Karşılanamayan/), k=f(/^Kod$/);
    const rows=t.satirlar.filter(r=>r[k]&&!isTot(r)), sm=i=>rows.reduce((x,r)=>x+N(r[i]),0);
    s+=`<div class="card dep"><div class="g4"><div><small>Stoksuz model</small><b class="neg">${nf(sm(a))}</b></div><div><small>Kritik</small><b class="or">${nf(sm(b))}</b></div><div><small>Düşük</small><b>${nf(sm(c))}</b></div><div><small>Karşılan- amayan</small><b class="neg">${nf(sm(g))}</b></div></div>
      <div class="note" style="margin:8px 0 0">İhtiyaç ${nf(sm(d))} adet · önerilen transfer ${nf(sm(e))} adet · mağazaya dokun: ihtiyaç listesini aç</div></div>`;
    s+=rows.slice().sort((x,y)=>N(y[a])-N(x[a])||N(y[d])-N(x[d])).map(r=>`<div class="card ga" data-tf="${esc(r[iM])}"><div class="sm"><div class="nm"><b>${esc(short(r[iM]))}</b><span>${N(r[a])} stoksuz · ${N(r[b])} kritik · ${N(r[c])} düşük model</span></div>
      <div class="kv"><small>İhtiyaç</small><b>${nf(r[d])}</b>${N(r[g])?`<span class="neg">Karşılanamayan ${nf(r[g])}</span>`:'<span class="stk">tamamı karşılanıyor</span>'}</div></div></div>`).join('');
    return s;
  }
  const iK=f(/^Kod$/), iM=f(/^Mağaza$/);
  const stores=[...new Set(t.satirlar.map(r=>r[iM]))].filter(Boolean).sort((p,q)=>String(p).localeCompare(String(q),'tr'));
  const fs=sel.ts||'';
  s+=chips([['','Tüm mağazalar']].concat(stores.map(x=>[x,short(x)])),fs,'ts');
  let rows=t.satirlar.filter(r=>!fs||r[iM]===fs);
  if(+cur===1){
    const iO=f(/^Öncelik/), iNeed=f(/^İhtiyaç \(30/), iUn=f(/^Karşılanamayan/), iP=f(/^Model$/), iKat=f(/^Kategori$/), iU=f(/^Ürün$/);
    const po=sel.to||'', tk=sel.tk==='1';
    s+=chips([['','Tümü'],['Stoksuz','Stoksuz'],['Kritik','Kritik'],['Düşük','Düşük']],po,'to')+chips([['','Hepsi'],['1','Karşılanamayanlar']],tk?'1':'','tk');
    rows=rows.filter(r=>(!po||String(r[iO]).startsWith(po))&&(!tk||N(r[iUn])>0));
    s+=`<div class="note" style="margin:0 0 8px">${rows.length} kayıt · karta dokun: kaynaklar ve ayrıntılar</div>`;
    const kay=h.map((x,i)=>/^Kaynak \d/.test(x)?i:-1).filter(i=>i>=0);
    const k0=kay.length?Math.min(...kay):h.length, skip=new Set([iK,iM,iO,iP,iKat,iU,iNeed,iUn,...kay]);
    h.forEach((x,i)=>{if(i>=k0)skip.add(i)});   // kaynak mağazaların alt kolonları kaynak satırlarında
    s+=rows.map(r=>{
      const pr=String(r[iO]||''), tag=`<span class="tag ${pr==='Stoksuz'?'t-red':/Kritik/.test(pr)?'t-org':'t-yel'}">${esc(pr)}</span>`;
      const det=h.map((x,i)=>(skip.has(i)||r[i]==null||r[i]==='')?'':`<i>${esc(x)}</i><b>${fmt(r[i],x)}</b>`).join('');
      const ky=kay.map(i=>r[i]?`<div class="dk">${kaynakHtml(r[i],r[i+4])}</div>`:'').join('')||'<div class="dk" style="color:var(--bad)">Kaynak bulunamadı</div>';
      return `<details class="card"><summary><div class="nm"><b>${esc(short(r[iM]))}</b><span>${tag}${esc(r[iP]||'')} ${esc(r[iKat]||'')}</span></div>
        <div class="kv"><small>İhtiyaç</small><b>${fmt(r[iNeed],'')}</b>${N(r[iUn])>0?`<span class="neg">Karşılanamayan ${nf(r[iUn])}</span>`:''}</div></summary>
        <div class="det"><div style="grid-column:1/-1;font-size:13px;padding:2px 0 4px">${esc(r[iU]||'')}</div><h4>Özet</h4>${det}<h4>Kaynak mağazalar</h4><div style="grid-column:1/-1">${ky}</div></div></details>`;
    }).join('');
    return s;
  }
  // 2) satmayan stok
  const iP=f(/^Model$/), iKat=f(/^Kategori$/), iU=f(/^Ürün$/), iSt=f(/^Satılabilir/), iOn=f(/^Öneri/);
  const hed=h.map((x,i)=>/^(Önerilen )?[Hh]edef \d|^Önerilen hedef/.test(x)?i:-1).filter(i=>i>=0);
  const skip=new Set([iK,iM,iP,iKat,iU,iOn,...hed]);
  s+=`<div class="note" style="margin:0 0 8px">${rows.length} kayıt · karta dokun: hedef mağazalar</div>`;
  s+=rows.map(r=>{
    const det=h.map((x,i)=>(skip.has(i)||r[i]==null||r[i]==='')?'':`<i>${esc(x)}</i><b>${fmt(r[i],x)}</b>`).join('');
    const ky=hed.map(i=>r[i]?`<div class="dk">${kaynakHtml(r[i])}</div>`:'').join('');
    return `<details class="card"><summary><div class="nm"><b>${esc(short(r[iM]))}</b><span>${esc(r[iP]||'')} ${esc(r[iKat]||'')}</span></div><div class="kv"><small>Stok</small><b>${fmt(r[iSt],'')}</b></div></summary>
      <div class="det"><div style="grid-column:1/-1;font-size:13px;padding:2px 0 4px">${esc(r[iU]||'')}</div>${det}${ky?`<h4>Gidebileceği mağazalar</h4><div style="grid-column:1/-1">${ky}</div>`:''}${r[iOn]?`<div style="grid-column:1/-1;font-size:12px;color:var(--mut);padding-top:6px">${esc(r[iOn])}</div>`:''}</div></details>`;
  }).join('');
  return s;
}

/* ---------- çizim ---------- */
function render(){
  if(!D)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab&&(tab!=='daha'||(b.dataset.s||'')===(sel.dh||''))));
  const on=document.querySelector('nav button.on'); if(on&&on.scrollIntoView)on.scrollIntoView({inline:'nearest',block:'nearest'});
  const y=window.scrollY;
  M.innerHTML=({ozet:vOzet,kat:vKat,mag:vMag,urun:vUrun,trf:vTrf,daha:vDaha}[tab]||vOzet)();
  bindChips();
  const q=$('#q'); if(q)q.oninput=()=>{sel.q=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const go=(t,fn)=>{tab=t;LS.set('tab',t);if(fn)fn();render();window.scrollTo(0,0)};
  M.querySelectorAll('[data-mk]').forEach(el=>el.onclick=e=>{e.stopPropagation();const k=el.dataset.mk;go('mag',()=>{sel.mk=k})});
  M.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(b.dataset.back==='mk')sel.mk=null;if(b.dataset.back==='dh'){sel.dh='';if(sel.dhfrom){tab=sel.dhfrom;sel.dhfrom='';LS.set('tab',tab)}}render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-bk]').forEach(el=>el.onclick=()=>{sel.bk=el.dataset.bk;sel.bl='';sel.q='';render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-bkback]').forEach(el=>el.onclick=()=>{sel.bk=null;render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-bf]').forEach(el=>el.onclick=()=>{sel.bf=+el.dataset.bf;sel.bs=0;sel.q='';sel.brg='';render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-bback]').forEach(el=>el.onclick=()=>{sel.bf=null;sel.q='';render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-dhgo]').forEach(el=>el.onclick=()=>{sel.dhfrom='ozet';sel.dh=el.dataset.dhgo;sel.q='';tab='daha';LS.set('tab','daha');render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-dh]').forEach(el=>el.onclick=()=>{sel.dhnav=false;sel.dh=el.dataset.dh;render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-ara]').forEach(el=>el.onclick=()=>go('urun',()=>{sel.q=D.urunler.u[+el.dataset.ara];sel.urg=GAB;sel.ustk=''}));
  M.querySelectorAll('[data-tf]').forEach(el=>el.onclick=()=>{sel.tr='1';sel.ts=el.dataset.tf;sel.to='';sel.tk='';render();window.scrollTo(0,0)});
  M.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  M.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{const t=paylasMetin(b.dataset.sh,b.dataset.arg);if(t)paylas(t)});
  M.querySelectorAll('.imgs img').forEach(im=>{loadImg(im,im.dataset.f);im.onclick=()=>{$('#zoom img').src=im.src;$('#zoom').style.display='block'}});
  window.scrollTo(0,y);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;LS.set('tab',tab);sel.q='';if(tab==='mag')sel.mk=null;if(tab==='daha'){sel.dh=b.dataset.s||'';sel.dhfrom='';sel.dhnav=!!b.dataset.s}window.scrollTo(0,0);render()});
$('#zoom button').onclick=()=>{$('#zoom').style.display='none'};
$('#rf').onclick=()=>load(true);
$('#st').onclick=()=>{if(confirm('Çıkış yapılsın mı? (Şifre bu cihazdan silinir)')){LS.del('pw');LS.del('cache_enc');D=null;KEY=null;gate()}};
/* tema: Otomatik (telefon ayarı) → Açık → Koyu */
const TEMA=['auto','light','dark'], TIC={auto:'◐',light:'☀',dark:'☾'}, TAD={auto:'Otomatik',light:'Açık',dark:'Koyu'};
let _tt=0;
function temaUygula(t,bildir){
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  $('#th').textContent=TIC[t]; $('#th').title='Tema: '+TAD[t]; LS.set('tema',t);
  if(bildir){const e=$('#toast');e.textContent='Tema: '+TAD[t];e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),1400)}
}
$('#th').onclick=()=>{const c=LS.get('tema')||'auto';temaUygula(TEMA[(TEMA.indexOf(c)+1)%3],true)};
temaUygula(LS.get('tema')||'auto');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* yeni sürüm uyarısı: index.html'deki surum numarası çalışandan farklıysa şerit göster */
const SURUM=(document.querySelector('meta[name=surum]')||{}).content;
async function surumKontrol(){
  try{
    const t=await (await fetch('index.html?'+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/name="surum" content="([^"]+)"/);
    if(m&&SURUM&&m[1]!==SURUM)$('#upd').hidden=false;
  }catch(e){}
}
const guncelle=async()=>{
  try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
  location.replace(location.pathname+'?s='+Date.now());
};
$('#updgo').onclick=guncelle; $('#gn').onclick=guncelle;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')surumKontrol()});
surumKontrol();
load();
</script>
