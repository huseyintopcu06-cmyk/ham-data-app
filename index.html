<style>

html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}

header small{opacity:.8;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.2}
#st{font-size:11px;padding:5px 7px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16202e;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}

header .row>div:first-child{min-width:0;flex:1}
header .row>div:last-child{flex:none;display:flex;gap:4px}
header h1,header small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#upd{position:sticky;top:58px;z-index:4;background:#FFC000;color:#1a1a1a;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
#upd[hidden]{display:none}
#blg{max-width:100%;font-size:12.5px;font-weight:600;-webkit-appearance:none;appearance:none;padding-right:12px}#blg option{color:#111;background:#fff}
#byt{margin:8px 12px 0;border-radius:16px;padding:9px 14px;font-size:13.5px;font-weight:600;line-height:1.35}#byt[hidden]{display:none}
#byt.s{background:#FFE9B8;color:#5c3d00}#byt.k{background:#F8CBAD;color:#7a1810}
#upd button{background:#1F3864;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:700}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 11.5%;min-width:44px;background:none;border:0;padding:7px 0 6px;font-size:9.5px;font-weight:600;letter-spacing:-.2px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;--c:#4F8EF7}
nav button b{font-size:21px;line-height:1.1;font-weight:700;color:var(--c)}
nav button.al{position:relative}nav button.al::after{content:'';position:absolute;top:5px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px var(--card)}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
nav button.on{color:var(--navy);font-weight:700}
@media(prefers-color-scheme:dark){nav button.on{color:#8db6ff}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff}
h2{font-size:14px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;overflow:hidden}
.card.ga{background:var(--ga);border-color:var(--ga-line)}
.card summary{list-style:none;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.rk{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:13px}
.nm{flex:1;min-width:0}

.kv .stk{color:var(--mut);font-weight:500;margin-top:1px}
.det{border-top:1px solid var(--line);padding:6px 12px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.det h4{grid-column:1/-1;margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--org)}
.det i{font-style:normal;color:var(--mut)}
.det b{text-align:right}
.dbtn{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ad));color:#fff;font-weight:600;font-size:13px;letter-spacing:.2px;box-shadow:0 2px 6px rgba(31,56,100,.35)}
.dbtn i{font-style:normal;font-size:15px;transition:transform .2s}
.card.dep:not([open]) .dbtn .b{display:none}.card.dep[open] .dbtn .a{display:none}.card.dep[open] .dbtn i{transform:rotate(180deg)}
.card.dep[open] .dbtn{background:linear-gradient(135deg,#5b6b82,#3a4658);box-shadow:none}
.dbtn:active{filter:brightness(1.15)}
.gg{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:6px 0 2px}
.gg .mt{margin:0}.gt th{text-align:left!important;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.gt th.hs{background:#c65911}.gt th.hk{background:#2E75B6}.gt th.hg{background:#17803d}.gt th.ha{background:#5b6b82}
.mt.gt td:first-child{min-width:0;max-width:none;color:var(--mut)}.mt.gt{overflow-x:visible}.mt.gt table{table-layout:auto}.gg>div{min-width:0}.gt td.v{text-align:right;white-space:normal}.gt td.v.n{width:1%;white-space:nowrap}
.gt tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--chip) 55%,transparent)}
.chip.rs{padding:5px 12px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ad));border-color:transparent}
.mmf{color:var(--ac);font-weight:700;text-decoration:none;padding:3px 0 3px 2px;white-space:nowrap}
.art{display:block;font-size:10.5px;color:var(--mut);font-weight:500;letter-spacing:.2px;margin-top:1px}
.mt{margin:4px 0 6px}.mt table{font-size:12px}.mt th,.mt td{padding:5px 7px}
.mt td:first-child,.mt th:first-child{position:static;white-space:normal;min-width:130px;max-width:190px;text-align:left;line-height:1.25;background:transparent}
.mt th{font-size:11px}.mt th small{display:block;font-weight:400;opacity:.8;font-size:9.5px}
.mt th.hs{background:#c65911}.mt th.hk{background:#2E75B6}.mt th.hg{background:#17803d}
.mt td.s b{color:var(--org)}.mt td.k b{color:var(--ga-line)}.mt td.g b{color:var(--ok)}.mt td.p{color:var(--mut)}.mt td.z{color:var(--line);text-align:center}
.mt tr.tot td{font-weight:700;background:var(--chip)}
.yrm{font-size:13px;line-height:1.45;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.yr{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;white-space:normal}
.bt th:first-child,.bt td:first-child{position:static;text-align:right;background:inherit;z-index:0}
.bt td:first-child{background:transparent}
.bt th.s1,.bt td.s1{position:sticky;left:0;z-index:2;text-align:left;background:var(--card)}
.bt th.s1{background:var(--navy)}
.bt tr.ga td.s1{background:var(--ga)}.bt tr.tot td.s1{background:var(--chip)}
.bt tr.rgh td.s1{background:linear-gradient(135deg,var(--ac),var(--ad));color:#fff;font-weight:700;font-size:13px;letter-spacing:.2px;text-align:left;padding:7px 10px}
.bt th{line-height:1.25}.bt th small{display:block;font-weight:400;opacity:.8;font-size:10.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;font-weight:600;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--navy)}
tr.ga td{background:var(--ga)}
tr.tot td{font-weight:700;background:var(--chip)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-right:6px}
.t-grn{background:#c6e7c9;color:#17622a}.t-red{background:#f8cbad;color:#a4261c}.t-org{background:#fce4d6;color:#a4501a}.t-yel{background:#fff2cc;color:#7a5b00}
.imgs img{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;background:#fff}
.msg{text-align:center;color:var(--mut);padding:36px 12px}
.setup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.setup input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0 10px}
.setup .go{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.hrow{padding:8px 0;border-top:1px solid var(--line)}.hrow:first-child,.note+.hrow{border-top:0}
.hb{position:relative;height:8px;border-radius:8px;background:rgba(127,127,127,.2);margin:9px 0 6px}
.hb i{display:block;height:100%;border-radius:8px;background:var(--ok)}.hb i.sinir{background:#e0a800}.hb i.geride{background:var(--bad)}
.hb u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.6}

.card .sm{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.chev{color:var(--mut);font-size:20px;padding-left:4px}
.dep{padding:10px 12px}
.dh2{display:flex;align-items:center;gap:8px;margin-bottom:8px}.dh2 span{font-size:12px;color:var(--mut)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.g4 small{display:flex;align-items:flex-end;justify-content:center;min-height:24px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;line-height:1.15;margin-bottom:2px}
.g4 b{font-size:17px}.g4 b.or{color:var(--org)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.dik{padding:4px 12px 6px;border-color:var(--org)}

.dsat[data-go]{cursor:pointer}
.dot{flex:none;width:10px;height:10px;border-radius:50%}.dot.red{background:#d9453d}.dot.org{background:#e8873a}.dot.yel{background:#e6b422}
.dt{flex:1;font-weight:600;font-size:14px}.dt small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.dl{padding:0 0 8px 20px;font-size:13px}.dk{padding:3px 0}.dk small{color:var(--mut)}
.pill{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 7px;margin:2px 3px 2px 0;font-size:12px}

.urow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.urow:first-child{border-top:0}
details .urow{grid-template-columns:1fr 54px 64px 54px}
details .urow span+span{text-align:right}
.urow.h{font-size:11px;color:var(--mut);text-transform:uppercase}
.urow[data-mk]{cursor:pointer}.urow.gar{background:var(--ga)}
.urow.al-r{background:rgba(224,49,49,.13);border-left:4px solid #E03131;padding-left:8px;border-radius:8px;margin:3px 0}.urow.al-g{background:rgba(43,138,62,.13);border-left:4px solid #2B8A3E;padding-left:8px;border-radius:8px;margin:3px 0}.urow.al-s{background:rgba(245,159,0,.2);border-left:4px solid #F59F00;padding-left:8px;border-radius:8px;margin:3px 0}

tbody tr[data-mk]{cursor:pointer}

#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;overflow:auto;-webkit-overflow-scrolling:touch}

.bdh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line)}

<script>
'use strict';
const $=s=>document.querySelector(s), M=$('#m');
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let D=null, P=null, sel={}, mode='', SALTB='';
let tab=LS.get('tab'); if(!['ozet','kat','mag','urun','trf','daha'].includes(tab))tab='ozet';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isGA=r=>r.some(c=>typeof c==='string'&&/G[ÜU]NEY ANADOLU/i.test(c));
const isTot=r=>r.some(c=>typeof c==='string'&&/TOPLAM/.test(c));

/* ---------- sayı biçimi ---------- */
function fmt(v,h){
  if(v==null||v==='')return '–';
  if(typeof v==='string')return esc(v);
  h=h||'';
  if(/Payı|İHS/.test(h)&&Math.abs(v)<=1.5)return (v*100).toFixed(1).replace('.',',')+'%';
  if(/Tempo|vs |Tahmin vs/.test(h)&&Math.abs(v)<20){const p=Math.round(v*100);return (p>0?'+':'')+p+'%'}
  if(/Devir/.test(h))return v.toFixed(2).replace('.',',');
  if(Number.isInteger(v))return v.toLocaleString('tr-TR');
  return Math.abs(v)<100?v.toFixed(1).replace('.',','):Math.round(v).toLocaleString('tr-TR');
}
const sgn=(v,h)=>/Tempo|vs /.test(h||'')&&typeof v==='number'?(v>0?'pos':v<0?'neg':''):(typeof v==='number'&&v<0?'neg':'');

/* ---------- veri yükleme (şifreli) ---------- */
let KEY=null, SALT=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function gunzip(buf){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
async function openPack(text,pw,reuse){
  const p=JSON.parse(text);
  const key=(reuse&&KEY&&SALTB===p.salt)?KEY:await deriveKey(pw,b64(p.salt),p.iter);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));   // yanlış şifrede hata verir
  if(!reuse){KEY=key;SALTB=p.salt}
  // Batı Marmara'ya şimdilik Zeki Gülsoy bakıyor (Uğur Çatalbaş ayrıldı); veri her yerde aynı adla gelsin
  return JSON.parse(new TextDecoder().decode(await gunzip(plain)).split('UĞUR ÇATALBAŞ').join('ZEKİ GÜLSOY (2)'));
}
/* Ankara mağazaları MDA ve Ankastre'de ortak Ankara deposunu (T802) kullanır: ürün satırları tek noktada ("ANKARA") toplanır, stok = depo
   (mağazaların kendi stoğu sayılmaz). Kategori düzeyinde (magList) depo, mağazalara kalan tahmini satış payına göre bölünür. */
const ANKK='ANKARA';
function ankaraDepo(DD){
  const U=DD&&DD.urunler, dp=U&&U.depo; if(!dp||dp._ok)return; dp._ok=1;
  const A=new Set(dp.k), C=new Set(dp.c), pool=new Map(), keep=[];
  U.r.forEach(r=>{ if(A.has(r[1])&&C.has(r[2])){let p=pool.get(r[0]); if(!p){p=[r[0],ANKK,r[2],0,0,0,0,0];pool.set(r[0],p)} p[3]+=r[3]; p[7]+=r[7]} else keep.push(r) });
  dp.r.forEach(d=>{let p=pool.get(d[0]); if(!p){p=[d[0],ANKK,d[1],0,0,0,0,0];pool.set(d[0],p)} p[4]=d[2]; p[5]=d[3]; p[6]=d[4]});
  const ref=U.m[dp.k[0]]; U.m[ANKK]=['ANKARA · ortak depo (T802)',ref?ref[1]:'İÇ ANADOLU',ref?ref[2]:''];
  U.r=keep.concat([...pool.values()].filter(p=>p[3]+p[4]+p[5]+p[6]+p[7]>0));
}
async function load(force){
  M.innerHTML='<div class="msg">Yükleniyor…</div>';
  const pw=LS.get('pw');
  if(!pw)return gate();
  let text=null, offline=false;
  try{
    const r=await fetch('veri.enc?'+(force?Date.now():''),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    text=await r.text(); LS.set('cache_enc',text);
  }catch(e){text=LS.get('cache_enc');offline=true}
  if(!text){M.innerHTML='<div class="msg">Veri alınamadı. İnterneti kontrol edip ↻ ye bas.</div>';return}
  try{
    D=await openPack(text,pw);
    P=null;
    try{ankaraDepo(D)}catch(e){console.warn('ankara depo',e)}
    try{const r2=await fetch('onceki.enc?'+Date.now(),{cache:'no-store'});if(r2.ok){P=await openPack(await r2.text(),pw,true);try{ankaraDepo(P)}catch(e){}}}catch(e){}
    done(offline?'Çevrimdışı: son kaydedilen veri gösteriliyor.':'');
  }catch(e){LS.del('pw');gate('Şifre yanlış ya da değişmiş. Yeniden gir.')}
}
function gate(err){
  $('#sub').textContent='şifre gerekli';
  M.innerHTML=`<div class="setup"><b>Şifre</b>
  <p class="note" style="margin-top:6px">Raporu görmek için sana verilen şifreyi gir. Bu cihazda hatırlanır.</p>
  ${err?`<p class="neg">${esc(err)}</p>`:''}
  <input id="pw" type="password" placeholder="Şifre" autocomplete="current-password">
  <button class="go" id="pwgo">Aç</button></div>`;
  const go=()=>{const v=$('#pw').value;if(v){LS.set('pw',v);load(true)}};
  $('#pwgo').onclick=go; $('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
const AYNO={ocak:1,'şubat':2,mart:3,nisan:4,'mayıs':5,haziran:6,temmuz:7,'ağustos':8,'eylül':9,ekim:10,'kasım':11,'aralık':12};
function veriTarihi(d){  // "1-11 Kasım 2026" -> "11.11.2026" (verinin son günü)
  const m=String(d||'').match(/(\d+)(?:\s*-\s*(\d+))?\s+(\S+)\s+(\d{4})/); if(!m)return '';
  const ay=AYNO[m[3].toLocaleLowerCase('tr')]; if(!ay)return '';
  return String(m[2]||m[1]).padStart(2,'0')+'.'+String(ay).padStart(2,'0')+'.'+m[4];
}
/* bayat veri uyarısı: verinin son günü bugünden 3+ gün gerideyse sarı, 5+ gün gerideyse kırmızı (normalde veri dünün verisidir; hafta sonu arası 3-4 gün olabilir) */
function bayatKontrol(){
  const e=$('#byt'); if(!e)return;
  const m=D&&veriTarihi(D.donem).match(/(\d+)\.(\d+)\.(\d+)/); if(!m){e.hidden=true;return}
  const bugun=new Date(); bugun.setHours(0,0,0,0);
  const yas=Math.round((bugun-new Date(+m[3],+m[2]-1,+m[1]))/864e5);
  if(yas<3){e.hidden=true;return}
  e.className=yas>=5?'k':'s'; e.hidden=false;
  e.textContent=`Veri güncel değil: son veri ${m[0]} (${yas} gün önce). Yeni rapor henüz gelmemiş olabilir; ↻ ile yeniden dene.`;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)bayatKontrol()});
function done(note){
  bayatKontrol();
  const vt=veriTarihi(D.donem); $('#ttl').textContent='Ham Data'+(vt?' · '+vt:'');
  $('#sub').textContent=(D.donem||'')+' · güncelleme '+(D.olusturma||'');
  render();
  if(note)M.insertAdjacentHTML('afterbegin',`<div class="note">${esc(note)}</div>`);
}

/* ---------- ortak bileşenler ---------- */
function table(t,opts){
  opts=opts||{};
  const h=t.kolonlar;
  let s='<div class="tw"><table><thead><tr>'+h.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';
  for(const r of t.satirlar){
    s+=`<tr class="${isGA(r)?'ga':''} ${isTot(r)?'tot':''}">`+h.map((x,i)=>{const hh=i>1?x+' '+(r[0]||''):x;return `<td class="${sgn(r[i],hh)}">${fmt(r[i],hh)}</td>`}).join('')+'</tr>';
  }
  return s+'</tbody></table></div>';
}
/* Bölgem: başlıktaki seçim. Seçiliyse sayfalardaki bölge filtreleri o bölgeye kilitlenir ve bölge düğmeleri gizlenir (Kategori sıralaması hariç: orada varsayılan olur, kıyas için değiştirilebilir). Boş = Key Account, her şey. */
let BLG=LS.get('bolgem')||'';
const BKEYS=['stg','dkg','bgrg','bd','mrg','urg','brg2','hrg','grg','prg','irg'];
function chips(items,cur,key,wrap){
  if(BLG&&BKEYS.includes(key))return '';
  return '<div class="chips'+(wrap?' wrap':'')+'">'+items.map(([id,label])=>`<button class="chip ${id===cur?'on':''}" data-k="${key}" data-v="${esc(id)}">${esc(label)}</button>`).join('')+'</div>';
}
function bindChips(){
  M.querySelectorAll('.chip[data-k]').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=b.dataset.v;if(b.dataset.k==='bs'||b.dataset.k==='bm')sel.q='';if(b.dataset.k==='om'||b.dataset.k==='oz')sel.okm=null;render()});
}
/* kart içi kolonları başlıklı gruplara ayır: mağaza bilgisi · Sell-out · Satılabilir stok · Açık sipariş · Ay başı */
const GRUP=[['Sell-out'],['Satılabilir stok'],['Açık sipariş'],['Ay başı stok']];
function grpAd(x){
  if(/Gelen|Açık Sipariş/i.test(x))return 3;
  if(/Başlangıç/i.test(x))return 4;
  if(/Satılabilir|Stok|Set (Siyah|Beyaz|Gri|Inox)|Devir/i.test(x))return 2;
  if(/^(Sıra|Kod|Personel|SPV|Bölge|Mağaza)$/i.test(x))return 0;
  return 1;

function kisaAd(x,k){   // grup içinde tekrar eden sözcükleri at

    const h=t.kolonlar, f=re=>h.findIndex(x=>re.test(x));

      const sat=(r[iB]!=null&&r[iG]!=null)?r[iB]-r[iG]+Math.max(0,fc-v):null;

const _ki=new WeakMap();
function katInfo(k,DD){
  DD=DD||D; let c=_ki.get(DD); if(!c){c={};_ki.set(DD,c)}

  if(!t){c[k]=null;return null}
  const h=t.kolonlar, ix=n=>h.indexOf(n);

  const idxs=re=>h.map((x,i)=>re.test(x)?i:-1).filter(i=>i>=0);
  let main=h.findIndex(x=>/Satış Adeti|Toplam Adet|^Toplam|Tam Otomatik/.test(x)&&!/Tahmini|Ort\.|Stok/.test(x));
  if(main<0)main=ix('Bölge')+1;
  const pm=oncekiAy(DD);

    rows:t.satirlar.filter(r=>!isTot(r)&&r[ix('Kod')]),tot:t.satirlar.find(isTot),
    i:{kod:ix('Kod'),name:ix('Mağaza'),spv:ix('SPV'),bolge:ix('Bölge'),rank:ix('Sıra'),per:ix('Personel'),main,

}

/* ---- ürün kartı: günlük satış ve stok geçmişi ---- */
function urunGrafik(ui,ga){
  const U=D.urunler, G=U&&U.g; if(!G||!G.v||!G.v[ui])return '';
  const o=ga?2:0; let pg=0,pv=0; const pts=[];
  G.gunler.forEach((g,i)=>{const d=G.v[ui][i]; if(!d)return; const n=g-pg; if(n>0)pts.push({gun:g,d:(d[o]-pv)/n,st:d[o+1]}); pg=g; pv=d[o]});
  if(!pts.length)return '';
  const n=pts.length, mx=Math.max(1,...pts.map(p=>p.d)), W=320,H=126,L=8,R=8,T=24,B=30,ch=H-T-B,cw=W-L-R,slot=cw/n,bw=Math.min(34,slot*0.62);
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Günlük satış">`;
  svg+=`<line x1="${L}" x2="${W-R}" y1="${T+ch}" y2="${T+ch}" stroke="var(--line)"/>`;
  pts.forEach((p,i)=>{
    const x=L+slot*i+(slot-bw)/2, hh=Math.max(1.5,Math.max(p.d,0)/mx*ch), son=i===n-1, cx=(x+bw/2).toFixed(1);
    svg+=`<rect x="${x.toFixed(1)}" y="${(T+ch-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" fill="${son?'var(--org)':'var(--ga-line)'}" opacity="${son?1:.7}"/>`;
    if(n<=16)svg+=`<text x="${cx}" y="${(T+ch-hh-4).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ink)">${fmtD(p.d)}</text>`;
    if(n<=16||i===0||son||i%2===0)svg+=`<text x="${cx}" y="${H-17}" font-size="9" text-anchor="middle" fill="var(--mut)">${p.gun}</text>`;
    if(n<=10)svg+=`<text x="${cx}" y="${H-5}" font-size="8.5" text-anchor="middle" fill="var(--mut)">stok ${nf(p.st)}</text>`;
  });
  svg+='</svg>';
  const f=pts[0], l=pts[n-1];
  return `<div class="ugr"><div class="note" style="margin:0 0 2px"><b>Günlük satış (adet/gün)</b> · ${ga?'Güney Anadolu':'Türkiye (fiziksel)'}</div>${svg}<div class="note" style="margin:2px 0 6px">Çubuk altı: rapor günü ve satılabilir stok${n>1?` · stok ${nf(f.st)} → ${nf(l.st)}`:' · günler geçtikçe çubuklar çoğalır'}</div></div>`;
}

function uyarilar(rg){   // rg: bölge adı; '' = Türkiye (Key Account). Verilmezse seçili bölge ya da Dikkat kartındaki seçim
  if(rg==null)rg=BLG||sel.dkg||'';
  const ga=magList().arr.filter(m=>m.bolge!=='ONLINE'&&(!rg||m.bolge===rg)); if(!ga.length)return {html:'',metin:''};
  const it=[], tx=[];
  // 1) ay sonuna yetmeyen stok
  const yet=[]; KATS.forEach(k=>{const l=ga.filter(m=>m.k[k]&&m.k[k].bas.some(v=>typeof v==='number'&&v<0)); if(l.length)yet.push([k,l])});
  if(yet.length){
    const oz=yet.map(([k,l])=>`${KLAB[k]||k}: ${l.length}`).join(' · ');
    it.push(`<details><summary><span class="dot org"></span><span class="dt">Ay sonuna yetmeyen stok<small>${esc(oz)} mağaza</small></span></summary><div class="dl">`+
      yet.map(([k,l])=>`<div class="dk"><b>${esc(KLAB[k]||k)}</b> ${l.map(m=>`<a class="lnk" data-mk="${m.kod}">${esc(m.ad)}</a>`).join(' · ')}</div>`).join('')+'</div></details>');
    tx.push('• Ay sonuna yetmeyen stok → '+oz+' mağaza');
  }
  // 2) stoksuz çok satan
  const z=stoksuzCokSatan(rg);
  if(z&&z.cift){
    it.push(`<details><summary><span class="dot red"></span><span class="dt">Stoksuz çok satan ürün<small>${z.liste.length} ürün · ${z.cift} mağaza-ürün</small></span></summary><div class="dl">`+
      z.liste.slice(0,8).map(a=>`<div class="dk"><a class="lnk" data-ara="${a.u}">${esc(D.urunler.u[a.u])}</a> <small>${a.n} mağaza · geçen ay ${a.g}</small></div>`).join('')+'</div></details>');
    tx.push(`• Stoksuz çok satan: ${z.liste.length} ürün (${z.cift} mağaza-ürün)`);
  }
  // 3) tahmin geçen ayın altında
  const low=[]; KATS.forEach(k=>{let a=0,b=0;ga.forEach(m=>{const x=m.k[k];if(x&&x.fc!=null&&x.ay!=null){a+=x.fc;b+=x.ay}});if(b>=20&&a/b-1<=-0.1)low.push([k,a,b])});
  if(low.length){
    const oz=low.map(([k,a,b])=>`${KLAB[k]||k} %${Math.round((1-a/b)*100)} altında`).join(' · ');
    it.push(`<div class="dsat"><span class="dot yel"></span><span class="dt">Tahmin geçen ayın altında<small>${esc(oz)}</small></span></div>`);
    tx.push('• Tahmin geçen ayın altında → '+oz);
  }
  // 4) transfer
  const t0=D.transfer&&D.transfer.filter(t=>t.satirlar.length)[0];
  if(t0&&(!rg||rg===GAB)){const h=t0.kolonlar,a=h.indexOf('Stoksuz model'),b=h.indexOf('Karşılanamayan');let sa=0,sb=0;t0.satirlar.forEach(r=>{sa+=N(r[a]);sb+=N(r[b])});
    if(sa||sb){it.push(`<div class="dsat" data-go="trf"><span class="dot org"></span><span class="dt">Transfer${rg?'':' (Güney Anadolu)'}<small>${nf(sa)} stoksuz model · ${nf(sb)} adet karşılanamıyor</small></span><span class="chev">›</span></div>`);tx.push(`• Transfer: ${nf(sa)} stoksuz model, ${nf(sb)} adet karşılanamıyor`)}}
  const ck=bolgeChips('dkg',rg);
  return {html:(it.length||ck)?`<div class="card dik"><div class="dhd">Dikkat · ${rg?tc(rg):'Türkiye'}</div>${ck}${it.length?it.join(''):'<div class="dsat"><span class="dt">Dikkat çeken bir şey yok<small>Bu bölgede uyarı görünmüyor</small></span></div>'}</div>`:'',metin:tx.join('\n')};
}

let BR=null, BRHATA='';
async function hedefAyYukle(ay){
  if(ay in HARS)return; HARS[ay]=null;
  try{const r=await fetch('hedef_'+ay+'.enc?'+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error(r.status);
    HARS[ay]=await openPack(await r.text(),LS.get('pw'),true)}catch(e){HARS[ay]=0}
  if(sel.hay===ay&&tab==='daha'&&sel.dh==='hedef')render();
}
async function brandYukle(){
  if(BR||BRHATA==='yukleniyor')return;
  BRHATA='yukleniyor';
  try{
    const r=await fetch('brand.enc?'+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error(r.status);
    BR=await openPack(await r.text(),LS.get('pw'),true); BRHATA='';
  }catch(e){BRHATA='BRAND verisi alınamadı.'}
  if(tab==='daha'&&(sel.dh==='brand'||sel.dh==='gecmis'||sel.dh==='sunum'))render();
}
const brandOran=h=>/[İIÜU]HS|PAY/i.test(h||'');
function brandFmt(v,h){
  if(v==null||v==='')return '';
  if(typeof v==='string')return esc(v);
  if(brandOran(h)&&Math.abs(v)<=1.5)return (v*100).toFixed(1).replace('.',',')+'%';
  return fmt(v,'');
}
/* BRAND kompakt görünüm: seçilen marka için mağazalar bölge bölge, değer + İHS + çubuk */
function brandKompakt(rows,hd,sc,bi,bcs){
  const pj=hd.findIndex(x=>/personel/i.test(x.a+x.b)); 
  let cur=bcs.find(c=>String(c.j)===String(sel.bb))||bcs.find(c=>/^bosch/i.test(c.ad))||bcs[0];
  const tcb=x=>String(x||'').toLocaleLowerCase('tr').replace(/(^|\s)\S/g,m=>m.toLocaleUpperCase('tr'));
  const val=r=>typeof r[cur.j]==='number'?r[cur.j]:null, ihs=r=>cur.ih>=0&&typeof r[cur.ih]==='number'?brandFmt(r[cur.ih],'İHS'):'';
  const isT=r=>r.some(c=>typeof c==='string'&&/TOPLAM/i.test(c));
  const tot=rows.filter(isT), st=rows.filter(r=>!isT(r));
  const mx=Math.max(1,...st.map(r=>val(r)||0));
  const pill=r=>{if(pj<0)return '';const v=String(r[pj]||'').trim(); return v?`<span class="tag ${/yok/i.test(v)?'t-red':/var/i.test(v)?'t-grn':'t-yel'}">${esc(v)}</span>`:''};
  const row=r=>`<div class="bkr ${isGA(r)?'ga':''}"><div class="nm"><b>${esc(String(r[sc]||'').replace(/^T\d{3}\s*-\s*/,''))}</b> ${pill(r)}</div><div class="v">${val(r)==null?'–':nf(val(r))}</div><div class="i">${ihs(r)}</div><div class="bar"><i style="width:${val(r)?Math.max(2,Math.round(val(r)/mx*100)):0}%"></i></div></div>`;
  const trow=r=>{const nm=(bi>=0&&typeof r[bi]==='string'&&r[bi].trim()&&/^\s*TOPLAM\s*$/i.test(String(r[sc]||'')))?tcb(r[bi])+' toplam':String(r[sc]||'');return `<div class="bkr tt"><div class="nm"><b>${esc(nm)}</b></div><div class="v">${val(r)==null?'–':nf(val(r))}</div><div class="i">${ihs(r)}</div></div>`};
  let s=`<div class="row" style="gap:8px;margin:2px 0 8px;align-items:center"><span class="note" style="margin:0">Marka</span><select class="bsel" onchange="sel.bb=this.value;render()">${bcs.map(c=>`<option value="${c.j}" ${c===cur?'selected':''}>${esc(c.ad)}</option>`).join('')}</select></div>`;
  s+=`<div class="note" style="margin:0 0 8px">${esc(cur.ad)} · satış adedi${cur.ih>=0?' · İHS':''} · ${st.length} mağaza</div>`;
  if(tot.length)s+='<div class="card oz">'+tot.map(trow).join('')+'</div>';
  const gr=new Map(); st.forEach(r=>{const k=bi>=0&&typeof r[bi]==='string'&&r[bi].trim()?r[bi].trim():'Mağazalar'; if(!gr.has(k))gr.set(k,[]); gr.get(k).push(r)});

function brandMagaza(rows,hd,sc,bi,bcs){

  const tot=rows.filter(isT), st=rows.filter(r=>!isT(r));
  if(!rows.length)return '<div class="msg">Mağaza bulunamadı.</div>';
  const cur=rows.find(r=>ad(r)===sel.bms)||st.find(r=>isGA(r))||st[0]||rows[0];
  const gr=new Map(); st.forEach(r=>{const k=bi>=0&&typeof r[bi]==='string'&&r[bi].trim()?r[bi].trim():'Mağazalar'; if(!gr.has(k))gr.set(k,[]); gr.get(k).push(r)});
  const opt=r=>`<option value="${esc(ad(r))}" ${r===cur?'selected':''}>${esc(ad(r))}</option>`;
  let s=`<div class="row" style="gap:8px;margin:2px 0 8px;align-items:center"><span class="note" style="margin:0">Mağaza</span><select class="bsel" style="max-width:78%" onchange="sel.bms=this.value;render()">`+
    [...gr.keys()].sort((a,b)=>(ORD.indexOf(a)<0?9:ORD.indexOf(a))-(ORD.indexOf(b)<0?9:ORD.indexOf(b))).map(k=>`<optgroup label="${esc(tcb(k))}">${gr.get(k).slice().sort((a,b)=>ad(a).localeCompare(ad(b),'tr')).map(opt).join('')}</optgroup>`).join('')+
    (tot.length?`<optgroup label="Toplamlar">${tot.map(opt).join('')}</optgroup>`:'')+`</select></div>`;
  const L=bcs.map(c=>({ad:c.ad,v:typeof cur[c.j]==='number'?cur[c.j]:null,ih:c.ih>=0&&typeof cur[c.ih]==='number'?brandFmt(cur[c.ih],'İHS'):''})).sort((a,b)=>(b.v==null?-1:b.v)-(a.v==null?-1:a.v));
  const marka=L.filter(x=>!/toplam|total/i.test(x.ad)), mx=Math.max(1,...marka.map(x=>x.v||0)), sm=marka.reduce((a,x)=>a+(x.v||0),0);
  const pv=pj>=0?String(cur[pj]||'').trim():'';
  s+=`<div class="bkh"><span>${esc(ad(cur))}${bi>=0&&!isT(cur)&&cur[bi]?' · '+esc(tcb(cur[bi])):''} ${pv?`<span class="tag ${/yok/i.test(pv)?'t-red':/var/i.test(pv)?'t-grn':'t-yel'}">${esc(pv)}</span>`:''}</span><b>${nf(sm)}</b></div>`;
  s+=`<div class="note" style="margin:0 0 8px">${marka.length} marka · satış adedi · İHS · çoktan aza</div>`;
  s+='<div class="card oz">'+L.map(x=>`<div class="bkr ${/bosch|siemens|profilo/i.test(x.ad)?'ga':''} ${/toplam|total/i.test(x.ad)?'tt':''}"><div class="nm"><b>${esc(x.ad)}</b></div><div class="v">${x.v==null?'–':nf(x.v)}</div><div class="i">${x.ih}</div>${/toplam|total/i.test(x.ad)?'':`<div class="bar"><i style="width:${x.v?Math.max(2,Math.round(x.v/mx*100)):0}%"></i></div>`}</div>`).join('')+'</div>';
  return s;
}

/* ---- paylaşım metinleri ---- */

  const vt=veriTarihi(D.donem);

    const BB=BLG||GAB, ga=magList().arr.filter(m=>m.bolge===BB);
    let t=`BSH · ${tc(BB)} · ${vt} (${D.donem})\n`;
    const a=BB===GAB?gaToplam(D):ga.reduce((x,m)=>x+m.top,0);
    if(a!=null)t+=`Toplam sell-out: ${nf(a)}\n`;
    KATS.forEach(k=>{const s1=ga.reduce((x,m)=>x+(m.k[k]?m.k[k].main:0),0),s2=ga.reduce((x,m)=>x+(m.k[k]&&m.k[k].fc?m.k[k].fc:0),0);if(s1||s2)t+=`${KLAB[k]||k}: ${nf(s1)} (tahmin ${nf(s2)})\n`});
    const u=uyarilar(BB).metin; if(u)t+='\n'+u;

    if(ux){
      const oos=(ux.byKod.get(arg)||[]).filter(r=>r[7]>=2&&r[5]+r[6]<=0).sort((a,b)=>b[7]-a[7]).slice(0,25);
      if(oos.length)t+='\nStoksuz çok satan (geçen ay satışı):\n'+oos.map(r=>`• ${U.u[r[0]]}${U.a&&U.a[r[0]]?' · Artikel: '+U.a[r[0]]:''} · ${r[7]} adet${r[6]>0?' · açık sipariş '+r[6]:''}`).join('\n')+'\n';
    }

      const S=ihtSatirlar(tip), x=S&&S.rows.find(r=>r.kod===arg); if(!x||!x.tot||!x.parts.length)return;
      t+=`\n${IHT[tip]} sipariş ihtiyacı (${x.tot} adet):\n`+x.parts.map(p=>{const a=artIht(p.ad);return `• ${p.g?p.g+' ':''}${p.ad}${a?' · Artikel: '+a:''} · ${p.v} adet`}).join('\n')+'\n';
    });
    return t?`SİPARİŞ LİSTESİ\n${m.ad} (${m.kod}) · ${vt}\n`+t.trimEnd():'';
  }
  if(kind==='kat'){
    const keys=KATS.filter(k=>katInfo(k)), k=keys.includes(sel.kat)?sel.kat:keys[0], I=katInfo(k), rg=sel.rg||'', q=fold(sel.q);
    const rows=I.rows.filter(r=>(!rg||r[I.i.bolge]===rg)&&(!q||fold(r[I.i.name]).includes(q))).slice(0,15);
    let t=`${KLAB[k]||k} · ${rg?tc(rg):'Türkiye'} · ${vt}\n`;
    rows.forEach((r,i)=>{t+=`${r[I.i.rank]||i+1}. ${sade(r[I.i.name])} — ${nf(r[I.i.main])}`+(I.i.fcs.length?` (tahmin ${nf(I.i.fcs.reduce((a,j)=>a+N(r[j]),0))})`:'')+'\n'});
    return t.trim();
  }
  return '';
}

    const parts=[]; for(let i=model0;i<h.length;i++){if(dn&&b[i]!==dn)continue;const v=N(r[i]); if(v>0)parts.push({g:b[i]||'',ad:h[i],v})}

function artIht(ad){const m=artMap(); if(!m)return ''; for(const t of String(ad).split(/[\s(]+/)){if(/\d/.test(t)&&/[A-Za-z]/.test(t)&&m.has(t))return m.get(t)} return ''}

  G.gunler.forEach(g=>{const v=val(g.m[kod]),n=g.gun-pg;if(n>0)pts.push({gun:g.gun,d:(v-pv)/n,n,v});pg=g.gun;pv=v});

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Günlük satış grafiği">`;

    if(n<=14)svg+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ch-hh-4).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ink)">${fmtD(p.d)}</text>`;

}

    rows=rows.filter(r=>(!po||String(r[iO]).startsWith(po))&&(!tk||N(r[iUn])>0));
    s+=`<div class="note" style="margin:0 0 8px">${rows.length} kayıt · karta dokun: kaynaklar ve ayrıntılar</div>`;
    const kay=h.map((x,i)=>/^Kaynak \d/.test(x)?i:-1).filter(i=>i>=0);
    const k0=kay.length?Math.min(...kay):h.length, skip=new Set([iK,iM,iO,iP,iKat,iU,iNeed,iUn,...kay]);
    h.forEach((x,i)=>{if(i>=k0)skip.add(i)});   // kaynak mağazaların alt kolonları kaynak satırlarında
    s+=rows.map(r=>{
      const pr=String(r[iO]||''), tag=`<span class="tag ${pr==='Stoksuz'?'t-red':/Kritik/.test(pr)?'t-org':'t-yel'}">${esc(pr)}</span>`;
      const det=h.map((x,i)=>(skip.has(i)||r[i]==null||r[i]==='')?'':`<i>${esc(x)}</i><b>${fmt(r[i],x)}</b>`).join('');
      const ky=kay.map(i=>r[i]?`<div class="dk">${kaynakHtml(r[i],r[i+4])}</div>`:'').join('')||'<div class="dk" style="color:var(--bad)">Kaynak bulunamadı</div>';
      return `<details class="card"><summary><div class="nm"><b>${esc(short(r[iM]))}</b>${artT(r[iM])}<span>${tag}${esc(r[iP]||'')} ${esc(r[iKat]||'')}</span></div>
        <div class="kv"><small>İhtiyaç</small><b>${fmt(r[iNeed],'')}</b>${N(r[iUn])>0?`<span class="neg">Karşılanamayan ${nf(r[iUn])}</span>`:''}</div></summary>
        <div class="det"><div style="grid-column:1/-1;font-size:13px;padding:2px 0 4px">${esc(r[iU]||'')}</div><h4>Özet</h4>${det}<h4>Kaynak mağazalar</h4><div style="grid-column:1/-1">${ky}</div></div></details>`;
    }).join('');
    return s;
  }
  // 2) satmayan stok
  const iP=f(/^Model$/), iKat=f(/^Kategori$/), iU=f(/^Ürün$/), iSt=f(/^Satılabilir/), iOn=f(/^Öneri/);
  const hed=h.map((x,i)=>/^(Önerilen )?[Hh]edef \d|^Önerilen hedef/.test(x)?i:-1).filter(i=>i>=0);
  const skip=new Set([iK,iM,iP,iKat,iU,iOn,...hed]);
  s+=`<div class="note" style="margin:0 0 8px">${rows.length} kayıt · karta dokun: hedef mağazalar</div>`;
  s+=rows.map(r=>{
    const det=h.map((x,i)=>(skip.has(i)||r[i]==null||r[i]==='')?'':`<i>${esc(x)}</i><b>${fmt(r[i],x)}</b>`).join('');
    const ky=hed.map(i=>r[i]?`<div class="dk">${kaynakHtml(r[i])}</div>`:'').join('');
    return `<details class="card"><summary><div class="nm"><b>${esc(short(r[iM]))}</b>${artT(r[iM])}<span>${esc(r[iP]||'')} ${esc(r[iKat]||'')}</span></div><div class="kv"><small>Stok</small><b>${fmt(r[iSt],'')}</b></div></summary>
      <div class="det"><div style="grid-column:1/-1;font-size:13px;padding:2px 0 4px">${esc(r[iU]||'')}</div>${det}${ky?`<h4>Gidebileceği mağazalar</h4><div style="grid-column:1/-1">${ky}</div>`:''}${r[iOn]?`<div style="grid-column:1/-1;font-size:12px;color:var(--mut);padding-top:6px">${esc(r[iOn])}</div>`:''}</div></details>`;
  }).join('');
  return s;
}

function yerindeCiz(keep,html){
  if(!keep.isConnected||keep.parentNode!==M)return false;
  const t=document.createElement('template'); t.innerHTML=html;
  const ni=t.content.querySelector('#'+keep.id); if(!ni||ni.parentNode!==t.content)return false;
  while(keep.previousSibling)keep.previousSibling.remove(); while(keep.nextSibling)keep.nextSibling.remove();
  let once=true; [...t.content.childNodes].forEach(n=>{if(n===ni){once=false;return} if(once)M.insertBefore(n,keep);else M.appendChild(n)});
  return true;
}

let _tt=0;
